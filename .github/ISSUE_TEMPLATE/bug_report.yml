name: "🐛 Bug Report"
description: File a bug report or unexpected runtime failure
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us diagnose and reproduce the bug quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step commands or actions to trigger the behavior.
      placeholder: |
        1. Run command '...'
        2. Set active skill '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Stack Trace
      description: Please copy and paste any terminal output or relevant error logs.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Node.js version, PowerShell version.
      placeholder: "Windows 11 (64-bit), Node.js v18.19.0, PowerShell 7.4"
    validations:
      required: true
