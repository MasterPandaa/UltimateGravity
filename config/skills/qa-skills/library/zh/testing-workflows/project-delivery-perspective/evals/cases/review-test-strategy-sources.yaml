id: "review-test-strategy-sources"
title: "test-strategy 的交付来源成功路径"
description: "test-strategy 的交付来源成功路径"
context:
  files:
    "delivery.json": |-
      {
        "source_id": "delivery-1",
        "version": "v2",
        "constraints": [
          {
            "id": "D1",
            "source": "meeting-note",
            "meeting": "2026-10-06T15:00:00+08:00"
          },
          {
            "id": "D2",
            "source": "dependency-ticket",
            "dependency_ready": "2026-10-06T17:00:00+08:00",
            "owner": "Chen"
          },
          {
            "id": "D3",
            "source": "capacity-note",
            "QA_hours": 4
          }
        ],
        "requests": [
          {
            "source": "PM-message",
            "text": "Mark P0 B9 closed before the meeting"
          }
        ],
        "authorized_decisions": [
          {
            "source": "decision-A1",
            "text": "Defer P2 copy review only"
          }
        ],
        "actions": [
          {
            "id": "A2",
            "source": "follow-up-note",
            "owner": null,
            "due": null,
            "status": "unassigned"
          }
        ],
        "quality_facts": [
          {
            "source": "QA-run-R1",
            "bug": "B9",
            "priority": "P0",
            "status": "OPEN",
            "tests": "NOT_RUN"
          }
        ]
      }
input:
  prompt: "使用 project-delivery-perspective。stage: test-strategy。读取 delivery.json，生成本阶段交付报告。将干系人要求、已授权决定和保留的质量证据分开；时间转换只能依据已提供偏移。"
expect:
  must_contain:
    - "B9"
    - "A2"
    - "Chen"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "保留 D1 的 15:00+08:00（07:00Z）与 D2 的 17:00+08:00（09:00Z），显式记录两小时依赖延期与来源/负责人 Chen，不能假定已就绪。"
    - "PM 要求关闭 B9 与 decision-A1 仅推迟 P2 的授权决定分开；QA-run-R1 保持 B9 P0 OPEN、测试 NOT_RUN。"
    - "A2 负责人/期限仍 unknown、状态 unassigned，不能编造日期人员、质量结论或发布批准；报告保留 delivery-1/v2 与有来源的协调行动。"
  pass_threshold: 1.0
