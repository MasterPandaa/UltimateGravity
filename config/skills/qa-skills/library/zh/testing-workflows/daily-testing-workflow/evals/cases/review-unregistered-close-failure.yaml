id: "review-unregistered-close-failure"
title: "未登记 P0 失败阻止收尾门禁"
description: "未登记 P0 失败阻止收尾门禁"
input:
  prompt: "使用 daily-testing-workflow。收尾输入：B19 上 run R19 的 P0-refund 为 FAIL，发生重复扣款；E19 截图已脱敏，但没有 bug ID 或升级记录；负责人 Mei 可联系。P2-label 已通过。输出收尾评估与唯一下一交接。"
expect:
  must_contain:
    - "P0-refund"
    - "R19"
    - "bug-reporting"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "未登记 P0-refund 失败使收尾门禁不通过，向 Mei 升级并把 R19/B19/E19 的复现与影响证据交给 bug-reporting。"
    - "单独保留 P2-label PASS，P0 风险/遗留项进入下一开工优先级，不能宣称当天全部完成。"
  pass_threshold: 1.0
