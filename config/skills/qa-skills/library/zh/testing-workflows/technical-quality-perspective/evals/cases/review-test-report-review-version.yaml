id: "review-test-report-review-version"
title: "技术报告评审保留版本错配"
description: "技术报告评审保留版本错配"
input:
  prompt: "使用 technical-quality-perspective。stage: test-report-review。报告声称 B25 重试安全通过，原始 run R24 只测 B24 且一项 FAIL。不执行代码、不批准发布地评审。"
expect:
  must_contain:
    - "B25"
    - "B24"
    - "R24"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "定位 B25/B24 证据错配和 R24 FAIL，不能把 B24 运行称 B25 证据或把 FAIL 改 PASS。"
    - "跟进 B25 身份与重试证据并回链来源，实现正确性与发布状态仍未知。"
  pass_threshold: 1.0
