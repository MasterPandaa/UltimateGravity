    Use discover-testing.
    只分析以下脱敏静态材料，不执行外部操作。按主 Prompt 给出理由、来源、信息缺口和最小验证。最后附表 `ID | DECISION | Evidence`，每个 ID 一行，DECISION 使用所给枚举之一。PASS/FAIL 只表示材料比较，不代表真实测试执行。
    Allowed DECISION values: rag-retrieval-testing.

    Route a request with labeled query->document relevance and top-k recall evidence; no answer text is supplied, target installation is unknown. Select retrieval evaluation, not answer-quality judgment. Append a table row `ROUTE | <exact canonical ID> | availability evidence`. The DECISION cell here is the canonical target ID.
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/graders/review-rag-retrieval-neighbor.py
