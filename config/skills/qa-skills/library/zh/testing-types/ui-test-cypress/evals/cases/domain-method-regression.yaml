id: domain-method-regression
title: "ui-test-cypress: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ui-test-cypress 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    现有项目Cypress13/E2E（fixture锁定基线，非推荐最新）；页面标题一直Checkout。C1真实付款后order.state=paid/amount20，主体A，spec断言这些值。C2 bug模式仍title正常但state=pending，spec只断言title。C3 cy.intercept只stub外部支付响应，真实UI状态pending，业务断言应失败。C4失败spec的CI命令追加||true。C5隔离账号A/B与cleanup均有证据。判C1/C5 VALID、C2 REPAIR、C3 EXPECTED_FAILURE、C4 INVALID；说明retry/边界与失败传播。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
