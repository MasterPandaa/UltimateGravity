id: "review-distributed-partial-commit"
title: "分布式部分提交违反给定不变量"
description: "分布式部分提交违反给定不变量"
context:
  files:
    "components.md": |-
      API -> payment ledger DB -> event broker -> order worker. Invariant Q1: at most one debit per operation; every committed debit eventually reconciles to order state.
    "sequence.md": |-
      # Sequence v6
      1. API accepts refund without operation key.
      2. Commit ledger debit.
      3. Publish PAID event to broker; broker can fail.
      4. On timeout caller retries step1.
      No outbox, dedup or reconciliation is defined.
input:
  prompt: "使用 technical-design-quality-review。静态审阅 components.md 与 sequence.md@v6，按给定不变量定位数据/集成/部分失败缺口，提出有证据设计行动，不能称已实现修复。"
expect:
  must_contain:
    - "Q1"
    - "sequence.md"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "TD 定位 sequence 第2步扣款提交后第3步事件发布失败，已付但无 PAID 事件，未提供原子 outbox/核对。"
    - "step1 重试无稳定 key 会违反最多一次扣款，回链接口边界/状态来源，不泛列微服务风险。"
    - "给出事务 outbox/核对与稳定 key 的设计决定和 step3 失败隔离验证、负责角色/关闭证据，不称 runtime/安全/性能通过。"
  pass_threshold: 1.0
