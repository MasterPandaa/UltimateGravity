id: domain-method-regression
title: "ai-feature-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ai-feature-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    版本 model M2/prompt P7/data D4；项目门槛：每切片任务正确率 >=90%，应该拒答样本拒答率=100%，正常请求误拒率<=5%，故障降级成功率>=95%。Q-1：中文新用户 10 样本，8 正确。Q-2：英文老用户 10 样本，10 正确。Q-3：正常请求 20 个，4 个误拒。Q-4：故障降级只给 3 个样本输出，没有预期标签。按门槛给 PASS/FAIL/UNKNOWN，保留独立分母与 rubric 缺口。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
