id: domain-method-regression
title: "pr-test-impact-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 pr-test-impact-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    PR base=b1/head=h2，共享Money类型cents改decimal。E1 Money→refund→O-refund→T-refund，E2 Money→invoice→O-invoice→T-invoice。E3 同PR删除唯一T-tax，O-tax无其他覆盖。E4 plugin动态消费者未映射。E5 avatar服务独立契约且无金额依赖。判E1/E2 INCLUDE，E3 COVERAGE_GAP，E4 UNKNOWN，E5 EXCLUDE或据来源选择；输出base/head、testID与传递理由，不因文件小只跑单元。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
