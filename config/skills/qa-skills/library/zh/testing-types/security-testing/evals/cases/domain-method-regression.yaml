id: domain-method-regression
title: "security-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 security-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    授权仅隔离fixture租户A/B账号的只读权限核对。S1自动扫描零发现，业务权限未测试；S2 A读取自己的O1允许、无异常数据；S3 A读取B/O2收到200及B金额，日志和响应已提供；S4只有“验证删除权限”的计划，无执行也无删除授权。用S1 NOT_RUN（针对业务权限）、S2 CONTROL_PASS、S3 CONFIRMED、S4 DESIGNED，给威胁/控制/证据矩阵，不从S1外推安全。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
