id: domain-method-regression
title: "ui-test-puppeteer: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ui-test-puppeteer 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    fixture Puppeteer23/browser来自该安装bundle。U1新窗口关联原page，核对目标receipt且paid20，finally关闭两page/browser。U2加载失败异常被catch忽略并return0，browser仍active。U3标题Checkout但state=pending。U4超时有截图/当前URL，原错误向runner传播，finally资源active0。U5给定不兼容browser启动日志。用VALID/FAIL/REPAIR/EXPECTED_FAILURE/CONFIG_ERROR，并给新窗口/加载失败/超时的资源核对证据。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
