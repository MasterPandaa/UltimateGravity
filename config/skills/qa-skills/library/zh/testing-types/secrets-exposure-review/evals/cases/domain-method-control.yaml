id: domain-method-control
title: "secrets-exposure-review: 正确对照与边界判定"
input:
  prompt: |
    请使用 secrets-exposure-review 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    F4 文档使用 ${SERVICE_SECRET}，扫描候选 fingerprint=mock-01，owner确认是示例标识、不对应凭据；仓库日志/CI/历史未提供。P4 只记录占位符对照与未评估区域。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可占位与确认合成对照，不强制作为泄露发现或要求轮换。"
    - "未提供区域保持未评估，不能宣称仓库无秘密或扫描完整。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
