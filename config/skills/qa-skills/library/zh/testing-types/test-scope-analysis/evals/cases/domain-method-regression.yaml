id: domain-method-regression
title: "test-scope-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 test-scope-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    新功能v2退款：范围已确认web/API与paid订单；native明确排除；guest是否退款未定义。S1 web/API paid路径；S2 native；S3 guest边界；S4生产真扣款验证没有授权但关键义务需隔离验证。用S1 INCLUDE/S2 EXCLUDE/S3 UNKNOWN/S4 BLOCKED，列版本/层/平台/数据状态单元和新规则到达后的重审触发，不把新功能全部当回归范围。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
