id: domain-method-regression
title: "test-data-requirement-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 test-data-requirement-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    场景S1：3个并行worker每个独立paid Order及同属该订单Refund，禁止共享。S2：计划退款场景但未给schema/字段。S3：要真实客户邮箱，未提供允许获取或脱敏授权。S4：相同订单重试2次，必须复用同refund_id而不是造两个业务键。用S1 SPECIFIED、S2 UNKNOWN、S3 BLOCKED、S4 SPECIFIED，说明实体关系/数量依据，不实际生成或取得真实资料。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
