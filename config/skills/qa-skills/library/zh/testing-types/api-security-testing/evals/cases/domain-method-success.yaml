id: domain-method-success
title: "api-security-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 api-security-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 GET /invoices/{id} 仅同租户所有者可读；PATCH 仅可改 memo，不可改 owner/tenant；list 最大 pageSize=50。
    D1 伪代码：get(id,user) 直接 findById(id)，不检查 owner/tenant；patch 将整个 body 合并到 row；list 无 pageSize 上限。仅静态代码，未提供运行响应。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "把对象权限、敏感字段写入和无分页限制分别对应 C1/D1，给允许/拒绝验证对照。"
    - "保持静态设计风险，不能声称跨租户访问成功或编造攻击响应。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
