id: "review-closed-model-control"
title: "固定用户负载不强制改到达速率模型"
description: "固定用户负载不强制改到达速率模型"
input:
  prompt: "使用 performance-test-k6。现有 options 为 constant-vus、vus20、duration1m，目标20并发用户且每次完成后等1s，无目标 RPS。提供 checks=100% 但没有 checks threshold，已有 p95 门槛。不运行地评审模型选择与通过限制。"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "给定并发用户/用户节奏适合 closed constant-vus，不能误强制独立100RPS到达。"
    - "check 记录条件结果、threshold 控制退出；缺 checks threshold 时仅 check 失败不能推断配置 CI 退出，不能外推生产容量。"
  pass_threshold: 1.0
