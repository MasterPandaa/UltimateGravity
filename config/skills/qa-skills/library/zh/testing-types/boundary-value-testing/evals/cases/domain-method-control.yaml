id: domain-method-control
title: "boundary-value-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 boundary-value-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C2 duration 为 integer seconds，范围 [0,10)；T2 -1 拒绝，0/1/9 接受，10/11 拒绝。另一个 decimal ratio 的最小步长未提供。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可开上界 10 被拒绝和闭下界 0 被接受，不把 10 当有效极值。"
    - "ratio 邻值保持待确认或符号化，不套用 seconds 的步长。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
