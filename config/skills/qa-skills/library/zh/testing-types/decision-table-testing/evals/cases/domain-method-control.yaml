id: domain-method-control
title: "decision-table-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 decision-table-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    B2 条件 member/coupon 均为布尔。R1 member=true→member20；R2 coupon=true→coupon10；未给二者重叠时优先级。P2 保留 11 的冲突，其余 00→full、01→coupon10、10→member20；full 为已声明无优惠默认。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可三个已定组合与 11 冲突标记，不用 P2 顺序或经验决定 11。"
    - "提出需要业务补优先级并保留冲突，不能强求复用 B1 的规则。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
