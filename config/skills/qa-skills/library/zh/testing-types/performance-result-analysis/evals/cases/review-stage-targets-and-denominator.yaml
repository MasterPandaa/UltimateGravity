id: "review-stage-targets-and-denominator"
title: "实际阶段结果核对达到负载和错误分母"
description: "实际阶段结果核对达到负载和错误分母"
context:
  files:
    "report.json": |-
      {
        "run_id": "PR42",
        "build": "B42",
        "environment": "perf-A",
        "targets": {
          "rps": 200,
          "p95_ms_max": 300,
          "error_rate_max": 0.01
        },
        "error_denominator": "completed requests",
        "stages": [
          {
            "id": "warmup",
            "duration_s": 10,
            "target_rps": 200,
            "achieved_rps": 80,
            "completed": 800,
            "errors": 0,
            "p95_ms": 90,
            "steady": false
          },
          {
            "id": "steady",
            "duration_s": 60,
            "target_rps": 200,
            "achieved_rps": 180,
            "completed": 10800,
            "errors": 216,
            "p95_ms": 350,
            "steady": true
          }
        ]
      }
input:
  prompt: "使用 performance-result-analysis。分析 report.json，目标适用于 steady 阶段而非 warmup。计算达到负载、错误与延迟结论，写明环境/负载容量限制，不执行测试。"
expect:
  must_contain:
    - "PR42"
    - "10800"
    - "216"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "steady180/200RPS=90%目标，p95350ms超300ms，216/10800=2%超1%；warmup p9590不是验收阶段。"
    - "不能用计划200RPS、warmup零错误或合阶段均值称通过；需保留阶段时长/样本与目标未达到限制。"
    - "结论仅 PR42/B42/perf-A 给定负载，不能证明生产容量或业务发布验收。"
  pass_threshold: 1.0
