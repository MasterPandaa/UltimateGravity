id: "review-met-target-control"
title: "有效稳态结果可通过明确局部门槛"
description: "有效稳态结果可通过明确局部门槛"
input:
  prompt: "使用 performance-result-analysis。PR43/B43/perf-A steady60s：目标200RPS且达到200RPS，completed12000、errors60、p95=250ms。目标 p95<=300ms、errors/completed<=1%、achievedRPS>=200，范围仅 sandbox read 负载。"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "60/12000=0.5%，允许三项明确局部门槛均满足，不能因无生产证据误拒当前局部结果。"
    - "保留60s/样本/环境/负载限制，不宣称生产上限或业务批准。"
  pass_threshold: 1.0
