id: domain-method-regression
title: "test-maintenance-cost-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 test-maintenance-cost-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    同月各20h。团队A 16h来自同selector重复实现、4h产品变化；B 16h来自runner宕机等待重试、4h产品变化；C 20h记录但无原因。M1建议A去重且保留业务断言；M2建议B优先稳定环境而不是重写所有测试；M3只因同20h给相同根因；M4评价C个人低效。用SUPPORTED/UNSUPPORTED/UNKNOWN判各建议并保持成本分组与来源，不能据总时长评绩效。 M5：C的具体成本成因无资料，判UNKNOWN。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
