id: "review-bytes-time-order-boundaries"
title: "边界候选保留单位、时区和事件顺序"
description: "边界候选保留单位、时区和事件顺序"
context:
  files:
    "rules.md": |-
      R1: label max 4 Unicode codepoints AND max 8 UTF-8 bytes.
      R2: expires when now >= 2026-10-07T00:00:00+08:00.
      R3: cancel before confirmation -> CANCELLED; confirmation before cancel -> CONFIRMED and cancel rejected.
    "examples.json": "{\"labels\":[\"éééé\",\"€€€\"],\"normal\":\"ab\",\"events\":[[\"cancel\",\"confirm\"],[\"confirm\",\"cancel\"]]}"
input:
  prompt: "使用 edge-case-discovery。仅从 rules.md 与 examples.json 发现最小高风险 EC 候选，计算字符/字节限制、当地过期相邻点和两种事件顺序，并引用规则 ID；不输出整套用例或已执行结果。"
expect:
  must_contain:
    - "R1"
    - "R2"
    - "R3"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "R1 字符<=4、UTF-8 字节<=8：四个 U+00E9 为 4 codepoints/8 bytes 合法边界，三个 U+20AC 为 3 codepoints/9 bytes 字节越界，不能混淆。"
    - "R2 2026-10-07 00:00+08:00 对应 2026-10-06 16:00Z，给出前/等于/后候选并保留等于时过期规则。"
    - "R3 cancel 先于 confirm 与 confirm 先于 cancel 是不同顺序候选，保留终态预期，不编造并发数或无限平台组合。"
  pass_threshold: 1.0
