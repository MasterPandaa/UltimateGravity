id: domain-method-success
title: "api-rate-limit-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 api-rate-limit-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 每租户固定窗口 [0,10)、[10,20)，N=3，计所有到达请求；超额 429 且 Retry-After 为距下一窗口的整秒数，额度内 200。
    T1 A@1→200,A@2→200,A@3→200,A@4→429/Retry-After:0；B@4→429；A@10→429。没有其他请求。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "复算 A@4 应 429/Retry-After:6，B@4 应 200，A@10 应恢复 200。"
    - "分别定位提示、租户隔离与重置冲突，不将前三个成功请求误报。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
