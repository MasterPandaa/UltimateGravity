id: domain-method-control
title: "metamorphic-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 metamorphic-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C2 first(list) 返回首元素，list 非空；x=[1,2]→1，置换 [2,1]→2。P2 提议置换前后输出相等，但没有这种关系合同。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "判 P2 的置换不保持 first 语义，不能把 1/2 差异报实现缺陷。"
    - "建议先取得合法关系/前提，或将关系不适用明确列出。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
