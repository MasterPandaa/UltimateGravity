id: domain-method-success
title: "metamorphic-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 metamorphic-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 sort 接受 integer lists，升序且保留多重集；对任意置换 T，sort(T(x))=sort(x)。
    F1 x=[2,1,1] 输出 [1,1,2]；T(x)=[1,2,1] 输出 [1,2]。P1 只比 distinct set 因此声称关系成立。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "指出变换后丢一个 1、输出不等，distinct set 相同不能满足 C1。"
    - "给保留重复的置换关系判据和反例，不能发明去重等价。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
