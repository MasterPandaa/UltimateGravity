id: domain-method-regression
title: "acceptance-criteria-review: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 acceptance-criteria-review 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    版本 v3，原 AC-7：订单金额 >= 100 元免运费；100 元订单仍被收 5 元运费。AC-8：相同 refund_id 重试不得重复扣账；退款 20 元成功后同 ID 重试，累计退款变成 40 元。AC-9：金额 < 100 元运费 5 元，99 元实收运费 5 元。AC-10：写着“及时退款”，没有时限或观测起止点。
    请逐项核对，保留原 AC ID 和原文，建议改写独立列出；判定值使用 FAIL/PASS/MISSING_RULE，并说明等于阈值与重复请求的可观察预期。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
