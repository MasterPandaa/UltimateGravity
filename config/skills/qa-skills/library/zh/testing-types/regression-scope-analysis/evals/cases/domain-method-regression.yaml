id: domain-method-regression
title: "regression-scope-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 regression-scope-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    金额组件变更，E1退款义务经共享类型直接依赖；E2发票经退款消费者间接依赖；E3动态税务plugin未知；E4独立图片服务无依赖。窗口仅够一个测试，项目要求退款与发票均为必须保护，尚无人接受缺口。判E1/E2 INCLUDE、E3 UNKNOWN、E4 EXCLUDE，窗口不足项BUDGET ESCALATE；不得静默只跑退款并说范围足够。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
