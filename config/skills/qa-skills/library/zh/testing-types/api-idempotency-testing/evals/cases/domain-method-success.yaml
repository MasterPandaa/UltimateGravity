id: domain-method-success
title: "api-idempotency-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 api-idempotency-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1：tenant+key 有效 60 秒；同键同载荷返回原 orderId 且只提交一单；同键异载荷 409，无新订单。
    T1 tenant A/key K/payload {qty:1}：t=0 提交 O1 后客户端超时；t=2 同键重试响应 orderId=O1。D1 提交账本为 [O1(key K),O2(key K)]，两笔 qty=1，发生于 t=0/2。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "指出相同响应 O1 不能抵消 D1 的两笔提交，定位超时后重试的重复副作用。"
    - "建议并发同键与异载荷矩阵，并把未给出的并发响应细节标缺口，不能编造。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
