id: domain-method-regression
title: "regression-optimization: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 regression-optimization 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    相同版本/环境/义务：基线顺序10分钟，重复退款故障使T-refund失败。O-1隔离后并行6分钟，同故障仍失败且无数据冲突。O-2删T-refund变4分钟，故障全绿。O-3换了不同规模项目3分钟却宣称提速70%。O-4关键义务映射缺失。用ACCEPT/REJECT/NOT_COMPARABLE/UNKNOWN，给收益比例、保护约束和解除缺口条件。
    计算结果另用 `METRIC | VALUE | 单位/依据` 表输出，METRIC 使用以下键：runtime_reduction_percent。VALUE 只写数字。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
