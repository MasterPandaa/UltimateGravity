id: "review-complete-operation-control"
title: "完整限定操作允许无设计阻塞发现"
description: "完整限定操作允许无设计阻塞发现"
context:
  files:
    "contract.md": |-
      # Orders v1 read contract
      GET /orders/{id}; id is a nonempty string. Bearer authentication required; owner must match the authenticated subject.
      200: {id:string, amount:integer USD cents}; nullable fields: none.
      400 invalid id: {code:"INVALID_ID",message:string}; 401 no token; 403 non-owner; 404 no order, each with code and message.
      C1 v1 expects these unchanged fields/types/units and ignores unknown optional fields. No version change is proposed.
      This operation is read-only and has no pagination; writes and rate-limit policy are outside this review. Logs carry a redacted request_id.
input:
  prompt: "使用 api-design-quality-review。仅审阅 contract.md 的 GET /orders/{id}。契约为设计意图而非执行证据；不得机械为不适用分页、幂等写入或未指定额外操作生成发现。"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "路径校验、错误体、资源权限、amount 类型单位与消费者兼容均已提供，不能误报缺失。"
    - "限定读取操作允许无设计阻塞，runtime 仍未评估，分页/写入重试不适用。"
  pass_threshold: 1.0
