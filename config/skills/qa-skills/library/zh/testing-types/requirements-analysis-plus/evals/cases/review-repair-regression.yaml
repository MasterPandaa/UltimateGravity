id: review-repair-regression
title: "requirements-analysis-plus: sourced repair regression"
input:
  prompt: |
    Use requirements-analysis-plus.
    只分析以下脱敏静态材料，不执行外部操作。按主 Prompt 给出理由、来源、信息缺口和最小验证。最后附表 `ID | DECISION | Evidence`，每个 ID 一行，DECISION 使用所给枚举之一。PASS/FAIL 只表示材料比较，不代表真实测试执行。
    Allowed DECISION values: PREPARED, UNKNOWN, UNSUPPORTED.

    Parsed input has 55 lines including Rule55 and user_id >= -1; retry-count > 3; password length12..64. Helper mode=evidence_preparation, analysis_status=NOT_ASSESSED, versions=UNKNOWN. Q1: source preservation verified. Q2: somebody declares "requirements are partially testable and inventory risk is P0" solely from that helper. Q3: user asks whether missing source versions are confirmed. Distinguish material preparation from semantic conclusions.
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/graders/review-repair-regression.py
  timeout_seconds: 30
