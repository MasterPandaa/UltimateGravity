id: domain-method-success
title: "recovery-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 recovery-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 RTO<=30s，自故障到订单读写恢复；RPO<=5s；已恢复区间的订单不得重复，金额须与源一致。
    T1 故障 t100，service health t110，业务 t140；恢复点 t92。源 O1=10,O2=20；恢复 [O1=10,O2=25,O2=25]。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "计算 RTO40s/RPO8s 超目标，指出 O2 重复/金额不符，不以 health10s 代替业务恢复。"
    - "给数据对账、去重/补偿与业务验证证据需求，不能自行修改数据。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
