id: domain-method-success
title: "failover-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 failover-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 网络分区后只允许一个 writer，切到 B 前必须 fencing A；业务 RTO<=20s。T1 t0 分区，t5 B 宣告 primary，t8 路由转 B/业务可用；A 未被 fencing，t9 A 写 O1=10、B 写 O1=20；未提供对账或切回记录。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "计算 RTO8s 可能符合目标，但识别双写/fencing 与 O1 冲突违反 C1，不能因可用就判切换通过。"
    - "对账和切回保留缺口，不凭节点角色字符串证明单写。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
