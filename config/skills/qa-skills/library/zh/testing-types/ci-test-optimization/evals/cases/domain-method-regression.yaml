id: domain-method-regression
title: "ci-test-optimization: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ci-test-optimization 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    同 commit/test-set/runner：基线 queue=20s, install=30s，两个并行测试job分别60s/40s，report=5s，无重试。候选 CI-1：有效缓存 install=10s，其余相同且检出同一故障。CI-2：移除金额回归job，变快但故障未检出。CI-3：失败job用 || true，汇总绿灯。CI-4：lockfile变化但复用旧缓存未验证。判定 ACCEPT/REJECT/UNKNOWN，给基线与CI-1端到端时间和关键路径。
    计算结果另用 `METRIC | VALUE | 单位/依据` 表输出，METRIC 使用以下键：baseline_seconds, candidate_seconds。VALUE 只写数字。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。若单元格需要包含字面竖线 `|`，必须写成 `\|` 或改写（包括行内代码）。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
