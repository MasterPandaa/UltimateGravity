id: domain-method-regression
title: "ui-test-webdriverio: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ui-test-webdriverio 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    fixture WebdriverIO8/async/matched浏览器。W1配置service名字不存在安装包，启动失败日志明确module缺失。W2click未await且未断言状态。W3paid断言遇pending失败，日志含test/worker/session/browser version及原堆栈，CI非0。W4各worker独立账号/订单、await动作、paid20/主体断言与cleanup。W5捕获命令timeout后输出PASS并exit0。用CONFIG_ERROR/REPAIR/EXPECTED_FAILURE/VALID/FAILURE_HIDDEN逐项，保留原错误，不换框架来绕过配置。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
