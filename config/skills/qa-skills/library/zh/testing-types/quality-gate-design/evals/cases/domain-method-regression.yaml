id: domain-method-regression
title: "quality-gate-design: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 quality-gate-design 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    门禁Gate-v3：关键义务均PASS且证据<=24h才可放行；UNKNOWN/BLOCKED fail-closed；例外必须负责人签字且未过期。G-1 测试记录缺失。G-2 环境故障不能运行。G-3 新鲜运行断言失败，有已过期签字例外。G-4 必要义务新鲜PASS且版本匹配。G-5 48h旧PASS。逐项UNKNOWN/BLOCKED/FAIL/PASS/UNKNOWN；同时给推进STOP/GO建议，旧或缺记录不能绿灯。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
