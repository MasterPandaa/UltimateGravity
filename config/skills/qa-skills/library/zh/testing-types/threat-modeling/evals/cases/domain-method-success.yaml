id: domain-method-success
title: "threat-modeling: 领域流程与结果判定"
input:
  prompt: |
    请使用 threat-modeling 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    A1 架构：不可信browser→API→InvoiceDB；browser传tenantId；API把tenantId直接用于查询，没有绑定认证身份。资产是租户invoice；P1要求只能读自身租户。
    模型范围仅三组件，未给消息队列、管理员入口或云平台配置。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "建browser/API信任边界，形成可控tenantId导致跨租户读取的候选路径，关联A1/P1与服务端绑定控制建议。"
    - "不添加队列/管理员/云威胁或宣称已读到其他租户数据；保留验证与残余风险。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
