id: domain-method-control
title: "threat-modeling: 正确对照与边界判定"
input:
  prompt: |
    请使用 threat-modeling 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    A2 架构为不可信 browser→API→InvoiceDB，API从已认证server-side context取tenantId且检查invoice.owner，忽略客户端tenantId；P2要求同租户所有者可读。仅架构声明，未给运行或日志。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可已声明绑定/owner控制对应P2，不将A1的缺控制结论直接套A2。"
    - "把控制验证与日志等未给领域标未知，不宣布无威胁/安全通过。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
