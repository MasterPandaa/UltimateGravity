id: domain-method-control
title: "disaster-recovery-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 disaster-recovery-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 区域 A 故障切区域 B；RTO<=60s，从故障到业务结账可用；RPO<=15s，从故障到恢复的最新提交点。
    C2 同 C1。T2 故障 10:00:00；数据点 09:59:50，校验和/隔离 restore 记录通过，业务及身份依赖 10:00:45 可用；恢复账本与源账本截至 09:59:50 的 ID/金额匹配。仅为 supplied fixture。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "按材料计算 RTO45s/RPO10s 满足 C2，并认可截至恢复点的对账，不能强制 RPO=0。"
    - "保留真实环境和恢复点之后业务补偿未验证的边界，不声称灾备演练完成。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
