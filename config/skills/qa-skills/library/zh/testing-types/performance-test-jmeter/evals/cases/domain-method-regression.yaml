id: domain-method-regression
title: "performance-test-jmeter: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 performance-test-jmeter 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    JMeter5.6.3/JDK17，脱敏JMX只请求本地fixture；规则p95<=200ms、error<=1%，CSV不允许重用。J-1 10线程无timer/实测吞吐却声称10RPS。J-2 CSV5行，10次读取，recycle=true违反不复用。J-3 JTL100条、2失败、p95=250ms，进程退出0。J-4 JTL100条无失败、p95=150ms，CSV足量/不复用，结构日志和业务断言正常。逐项 UNSUPPORTED/FAIL/PASS；给非GUI入口及缺插件/分布式前提。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
