id: domain-method-regression
title: "llm-hallucination-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 llm-hallucination-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    证据政策 D1-v2 第2条：自收货起14天内可退；第3条：运费不退。答案声明 H-1“14天内可退”，H-2“运费也退”，H-3“第9条规定终身保修”（提供文档只有1至3条，没有保修信息），H-4“今天新增海外条款”（当前政策页面无法访问）。给 SUPPORTED/CONTRADICTED/MISSING_SOURCE/UNASSESSABLE 的逐声明映射；不要因 H-1 正确整体通过，H-3 仅按提供证据判缺来源。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
