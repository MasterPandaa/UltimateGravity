id: domain-method-success
title: "ui-test-selector-review: 领域流程与结果判定"
input:
  prompt: |
    请使用 ui-test-selector-review 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    D1 页面两个区域：#billing含button accessibleName="Save"，#profile也含同名按钮；目标保存billing。T1 全页role button/name Save取first，DOM顺序可变。D2 英文Save、中文保存；无固定语言合同。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "指出T1匹配2个且first可能保存错区域，建议先scope billing再role/name，附该作用域唯一性验证。"
    - "指出硬编码英文的多语言前提，不能假设data-testid存在。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
