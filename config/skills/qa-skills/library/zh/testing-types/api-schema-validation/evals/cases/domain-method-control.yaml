id: domain-method-control
title: "api-schema-validation: 正确对照与边界判定"
input:
  prompt: |
    请使用 api-schema-validation 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    S2 JSON Schema 2020-12：{"oneOf":[{"type":"integer"},{"type":"string"}]}，样例 1 与 "1" 分别只满足一个分支，R2 均合法。
    S3={"$ref":"missing.json#/$defs/X"}，未提供 missing.json。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可 S2 两个合法对照，不机械禁止组合 schema。"
    - "S3 标引用未解析/blocked，不能推断合法或补造 X 的结构。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
