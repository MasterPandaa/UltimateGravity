id: domain-method-success
title: "retry-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 retry-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 端到端最大3次依赖尝试、deadline1000ms；400永久拒绝不可重试，503可重试；支付超时需同键查询/重试，不可重复扣费。
    T1 外层3次，每次内层3次调用，共9次、总1200ms。首次已扣费 P1但响应超时，后续换键扣 P2。T2 400后又试两次。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "定位9次>3、1200>1000、重复扣费/换键和400误重试，分别关联 C1。"
    - "不把外层次数当全链次数，也不把首次超时当无提交。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
