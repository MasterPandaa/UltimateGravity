id: domain-method-control
title: "retry-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 retry-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C2 GET为无副作用，最多3总尝试/deadline2000ms；503的HTTP Retry-After=1，表示收到响应后等1秒。
    T3 t0→503（耗时100ms），t1100再次调用→200（耗时100ms），共2尝试/1200ms；未启用嵌套重试，400路径未给。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可从响应t100到重试t1100等待1000ms和2次/1200ms预算，不能将HTTP Retry-After当毫秒或按请求起点误算。"
    - "永久错误、抖动与取消路径保持缺口，不能声称完整策略通过。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
