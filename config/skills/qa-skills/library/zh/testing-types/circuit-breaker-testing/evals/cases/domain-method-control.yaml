id: domain-method-control
title: "circuit-breaker-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 circuit-breaker-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 连续两次依赖失败即 open，open 10s；half-open 仅 1 个并发探测，失败立即 open 10s；成功 closed。open 返回 cached，不调用依赖。
    C2 同 C1。T2 t0/t1 失败→open；t2 cached/无依赖；t11 单探测成功→closed；t12 普通调用成功。未提供失败探测、滚动窗口或真实并发日志。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可 T2 与 C2 的连续失败和探测成功路径，不擅自改为滚动比例阈值。"
    - "失败探测及真实并发标缺口，不因一条路径吻合就断言熔断完整正确。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
