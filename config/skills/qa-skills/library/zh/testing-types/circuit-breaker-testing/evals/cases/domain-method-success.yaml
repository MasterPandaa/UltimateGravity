id: domain-method-success
title: "circuit-breaker-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 circuit-breaker-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 连续两次依赖失败即 open，open 10s；half-open 仅 1 个并发探测，失败立即 open 10s；成功 closed。open 返回 cached，不调用依赖。
    T1 t0/t1 两次失败；t2 又调用依赖；t11 两个并发探测均放行，一个失败；t12 普通请求放行。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "推导 t1 后 open、t2 应短路、t11 最多一个探测、失败后 t12 应 open，指出三个具体冲突。"
    - "不能只复述状态或 CBR 编号，须关联事件和兜底合同。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
