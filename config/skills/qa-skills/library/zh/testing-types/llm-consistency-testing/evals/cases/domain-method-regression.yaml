id: domain-method-regression
title: "llm-consistency-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 llm-consistency-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    同样本 S/model M1/prompt P2/temperature0/seed7，协议要求 JSON 必含 decision、amount，decision=APPROVE、amount=20；reason 可用同义句。L-1 三次分别合法 JSON、金额20、理由同义。L-2 三次中第三次缺 amount。L-3 只有一次输出，团队声称稳定。L-4 三次 JSON 结构合法，但未给语义预期。判定 PASS/FAIL/INSUFFICIENT_EVIDENCE/UNKNOWN，并给 L-2 结构失败数及分母，不因理由措辞变化误报。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
