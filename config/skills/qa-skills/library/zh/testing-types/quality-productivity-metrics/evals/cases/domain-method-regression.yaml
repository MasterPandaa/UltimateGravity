id: domain-method-regression
title: "quality-productivity-metrics: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 quality-productivity-metrics 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    同团队同窗口同复杂度：基线100个验收任务/100h，逃逸1；候选把用例拆成200条但仍100任务/100h，逃逸增至5。P-1有人称产能翻倍且质量改善。P-2候选另有相同任务100个/80h、逃逸1、返工工时可比且验收证据齐，允许说观察到工时效率改善。P-3团队A做支付、B做文案，只按用例数排名。用UNSUPPORTED/SUPPORTED/NOT_COMPARABLE，并报告投入/产出/质量/流程的平衡结论。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
