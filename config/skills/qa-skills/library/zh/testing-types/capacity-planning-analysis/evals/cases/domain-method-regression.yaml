id: domain-method-regression
title: "capacity-planning-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 capacity-planning-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    环境 E1 两实例、固定 mix；SLO p95<=200ms。测量100RPS:p95=150ms/CPU55%；150RPS:p95=260ms。K-1：建议由CPU55%宣称可支持300RPS。K-2：恒定到达130RPS，已验证服务100RPS，扩容等待60s，复算积压。K-3：失去一实例后没有测量。K-4：100RPS实测满足SLO。判定 UNSUPPORTED/CALCULABLE/UNKNOWN/SUPPORTED，保留条件和来源。
    计算结果另用 `METRIC | VALUE | 单位/依据` 表输出，METRIC 使用以下键：backlog_requests。VALUE 只写数字。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
