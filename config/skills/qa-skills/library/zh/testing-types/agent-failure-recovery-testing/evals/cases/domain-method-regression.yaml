id: domain-method-regression
title: "agent-failure-recovery-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 agent-failure-recovery-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    协议 R-v2：相同 operation_id 只能产生一条扣账；可查询后重试未提交步骤；权限永久错误必须停止并升级。F-1 trace：op=pay-1 扣账已提交，响应超时；重试又扣账，同 op 两条。F-2：三步任务前两步已提交，恢复仅执行第三步，最终三步各一条。F-3：403 permanent 后连续重试五次。给每条 trace PASS/FAIL，并给应走分支、恢复后状态及证据。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
