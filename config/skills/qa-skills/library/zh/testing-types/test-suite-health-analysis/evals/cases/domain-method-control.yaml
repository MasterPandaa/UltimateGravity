id: domain-method-control
title: "test-suite-health-analysis: 正确对照与边界判定"
input:
  prompt: |
    请使用 test-suite-health-analysis 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    R2 buildC/dataE：40项均首尝试通过，无重试/隔离；义务映射完整覆盖本次4项变更，耗时8min，budget10min；只有一轮记录。报告只给本次指标，长期稳定未评估。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可首尝试40/40、无重试和8min<=10min，不强加未知综合分或隔离问题。"
    - "保留单轮不能证明长期稳定/未来变更保护的边界。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
