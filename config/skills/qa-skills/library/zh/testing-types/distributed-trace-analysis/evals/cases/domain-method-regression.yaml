id: domain-method-regression
title: "distributed-trace-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 distributed-trace-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    同一时钟：根 span R [0,100]ms；同步子 A [10,70]、B [40,90]；A/B 同 parent=R。X-1：有人将100+60+50当端到端210ms。X-2：求R可见独占时间。X-3：异步 C link到R，无起止数据，声称C是根因。X-4：队列enqueue=20/dequeue=35ms。逐项 WRONG/CALCULABLE/UNKNOWN，给区间并集与队列计算，不把最慢span当根因。
    计算结果另用 `METRIC | VALUE | 单位/依据` 表输出，METRIC 使用以下键：observed_exclusive_ms, queue_ms。VALUE 只写数字。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
