id: domain-method-regression
title: "test-effectiveness-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 test-effectiveness-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    基线99/100通过。故障注入F1=重复扣账，T1仅断言标题而绿灯；F2=金额错误，T2账务断言失败；F3=环境断网，T3启动错误未进入业务断言；F4尚未注入。历史窗口一周另有重复扣账逃逸1个。用F1 MISSED/F2 DETECTED/F3 INCONCLUSIVE/F4 NOT_RUN，独立报告注入分母及历史逃逸，不能说99%通过率证明有效。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
