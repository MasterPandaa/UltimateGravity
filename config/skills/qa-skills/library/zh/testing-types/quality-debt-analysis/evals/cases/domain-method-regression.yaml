id: domain-method-regression
title: "quality-debt-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 quality-debt-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    Q-1 180天旧的重复测试helper，每月维护1h，无高风险保护缺口。Q-2 新1天的退款测试完全mock被测对象，昨日漏检重复扣账，资损仍暴露。Q-3 已确认生产重复扣账Bug尚未修复。Q-4 helper重构ticket已关闭，但无行为回归或维护影响证据。Q-5 重构代码/独立回归/维护样本与负责人验收均有记录。用LOWER_PRIORITY/HIGHER_PRIORITY/PRODUCT_DEFECT/NOT_CLOSED/CLOSED分项判定，不单按年龄排序。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
