id: domain-method-success
title: "chaos-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 chaos-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    H1 隔离 staging，目标研究单实例失败对结账的影响；基线 30 秒错误率 0%，控制组不注入；不变量：订单不得重复。
    P1 提议一次关闭全部数据库节点 10 分钟；只写“异常时停止”，没有可测阈值、监测频率、停止责任人或恢复步骤。没有执行记录。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "指出 P1 全节点扰动与 H1 单实例目标不符，停止/恢复不可执行，标执行准备 blocked。"
    - "不替项目编造停止阈值或声称注入/恢复完成；给需补材料的实验卡。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
