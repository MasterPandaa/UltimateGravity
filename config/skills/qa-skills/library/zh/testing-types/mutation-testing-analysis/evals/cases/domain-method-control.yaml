id: domain-method-control
title: "mutation-testing-analysis: 正确对照与边界判定"
input:
  prompt: |
    请使用 mutation-testing-analysis 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    POL2 未提供评分公式。R2 a killed,b survived,c no-coverage,d timeout，算子及原始日志可追溯；报告只列 1/1/1/1 分布，不给总分。等价证据未提供。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可分布且将公式标缺口，不强行套 POL1 或断言分数应为某值。"
    - "对 b/c/d 分别提出敏感性、覆盖与运行异常验证，不将不同类别混成失败。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
