id: domain-method-control
title: "ui-test-strategy: 正确对照与边界判定"
input:
  prompt: |
    请使用 ui-test-strategy 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C2 本次只改单价格式组件，不改API/旅程；义务是空/负数/合法金额格式与桌面/移动布局、accessible label。P2用component断言格式+visual两平台+label检查；复用现有checkout E2E作为未运行回归建议，未声称新证据。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可针对变更的最小分层组合，不要求每个格式值都新建E2E。"
    - "说明已有E2E只是建议且label检查不等于完整accessibility，保留适用范围。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
