id: domain-method-regression
title: "rag-quality-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 rag-quality-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    query问退款，检索C1-v2：“14天内且商品未使用可退；运费不退”；rubric要求含时间和未使用条件。A-1答“14天内可退运费”引用C1。A-2答“14天内且未使用可退，运费不退”引用C1。A-3答“14天内可退”引用C1，遗漏未使用。A-4问知识库未含的保修期限，正确说明缺依据并请求政策。用CONTRADICTED/PASS/INCOMPLETE/APPROPRIATE_REFUSAL，给声明-引用映射，不能以引用存在通过。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
