id: domain-method-regression
title: "mobile-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 mobile-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    支持矩阵只给Android14设备D1、iOS17设备D2；deeplink规则原始coupon=A%2BB解码一次为A+B。B-1 D1冷启动丢coupon。B-2 D2热启动coupon=A+B，路由及权限正确。B-3 支付op7已扣20元后切后台，恢复重试又扣20元。B-4 恢复先查op7，UI显示已支付20元，账务仅一条。B-5 想声称Android15已通过却未执行。逐项 FAIL/PASS/NOT_RUN，保留原URI、持久状态与矩阵缺口。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
