id: domain-method-regression
title: "ui-test-testcafe: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ui-test-testcafe 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    fixture TestCafe3既有CLI/runner。T1所有t动作await，独立Role账户，paid20业务断言及清理。T2 test只断言Checkout标题，pending模式仍绿灯。T3 runner.run()返回failedCount=1，但入口忽略并process.exit0。T4 pending模式业务断言失败，CLI非0、截图可关联testID。T5两个Role实际共享同账户/业务键互相污染。用VALID/REPAIR/FAILURE_HIDDEN/EXPECTED_FAILURE/ISOLATION_FAIL逐项，产物存在不等于运行通过。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
