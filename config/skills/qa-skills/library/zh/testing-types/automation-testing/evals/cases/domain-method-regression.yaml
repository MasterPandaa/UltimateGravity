id: domain-method-regression
title: "automation-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 automation-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    项目已用 Playwright。候选 C-1：稳定登录，隔离账号，oracle=会话主体与账户页一致，每日执行，清理可注销。C-2：每日变化原型，缺状态 oracle。C-3：高收益付款流程只连生产真扣款、无授权沙箱/清理。C-4：已有结账测试只断言页面标题，付款失败仍标题正常。逐项 ADOPT/DEFER/REPAIR，不因收益高换框架或直接压生产，明确投入门槛与业务断言。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
