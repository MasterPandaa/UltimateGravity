id: domain-method-regression
title: "requirement-consistency-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 requirement-consistency-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    词典v2：会员=member，金额分(cents)=元×100。C-1同v2会员限额100元与member限额10000分。C-2同v2同退款限额100元与120元。C-3同名“active”分别v1账户/v2订阅，没给实体和迁移映射。C-4同v2退款状态字典明确done=refunded，两文用不同词。用EQUIVALENT/CONTRADICTED/NOT_COMPARABLE逐项比较并列单位/版本/实体来源，别把词不同或同名跨版本直接判矛盾。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
