id: domain-method-success
title: "equivalence-partitioning: 领域流程与结果判定"
input:
  prompt: |
    请使用 equivalence-partitioning 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 虚构地区 A 邮编为 5 位数字字符串，B 为 6 位；C 地区不支持→UNSUPPORTED_REGION；支持地区格式错误→INVALID_POSTAL。
    P1 把所有数字邮编一类、所有无效一类；样例 A/"01234"、B/"01234"、B/"012345"、C/"01234"。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "正确判 A/01234 与 B/012345 有效，B/01234 是 INVALID_POSTAL，C 是 UNSUPPORTED_REGION。"
    - "指出 P1 抹掉地区依赖与不同无效行为，保留字符串前导零。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
