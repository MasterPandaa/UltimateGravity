id: domain-method-regression
title: "ui-test-playwright: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ui-test-playwright 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    项目已锁Playwright1.48，checkout title恒定。P1付款后state=pending但仅断言标题绿灯。P2业务断言toHaveText('paid')在pending模式失败并产trace、CI非0。P3两个context都用同账户/订单，worker互改数据。P4 A/B独立主体和order_id，各读回自己的paid金额20且清理无残留。P5仅写出测试文件没有运行。用REPAIR/EXPECTED_FAILURE/ISOLATION_FAIL/VALID/NOT_RUN逐项，不把trace文件存在或title正常等于验收。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
