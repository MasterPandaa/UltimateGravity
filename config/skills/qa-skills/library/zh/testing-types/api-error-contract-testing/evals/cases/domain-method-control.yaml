id: domain-method-control
title: "api-error-contract-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 api-error-contract-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C2 按 operation 的合同：GET /orders/{id} 的 MISSING 为 404，GET /search 的空结果为 200 []，二者不是同一错误；错误需 code/requestId，不要求 retryable 字段。
    T3 GET /orders/O9 返回 404 {code:MISSING,requestId:r3}。T4 GET /search 返回 200 []。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可 T3/T4 各自符合 C2，不把不同 operation 状态或缺 retryable 当缺陷。"
    - "缺少其他错误与日志证据时限制结论范围，不声称所有错误一致。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
