id: domain-method-regression
title: "test-runtime-optimization: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 test-runtime-optimization 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    同commit/义务/资源上限2workers：基线setup20s，tests A60s/B40s顺序，teardown10s。T1隔离后A/B并行，setup/teardown相同且金额故障仍被断言检出。T2也并行但共用账号使故障漏检。T3不同测试集只10s。T4只有候选估算没运行。用ACCEPT/REJECT/NOT_COMPARABLE/ESTIMATE，复算基线与T1关键路径时长，保留冷暖缓存口径。
    计算结果另用 `METRIC | VALUE | 单位/依据` 表输出，METRIC 使用以下键：baseline_seconds, candidate_seconds。VALUE 只写数字。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
