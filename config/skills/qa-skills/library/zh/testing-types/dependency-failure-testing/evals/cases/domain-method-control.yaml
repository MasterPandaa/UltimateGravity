id: domain-method-control
title: "dependency-failure-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 dependency-failure-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C2 异步通知服务：订单提交后可 pending notification，不得因通知超时重复订单；恢复后按 messageId 去重。
    T2 订单 O2 一次提交，通知 M2 延迟，caller=notification pending；恢复两次消费 M2 但发送一次。未给同步 payment 行为。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可异步 pending 与去重发送符合 C2，不要求同步即时成功或借用 C1。"
    - "支付、积压上限与恢复时间标未知，不凭一条消息确认所有故障隔离正确。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
