id: domain-method-success
title: "dependency-failure-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 dependency-failure-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 Checkout 同步调用 payment；超时后订单标 pending，先按支付 requestId 查状态，不能无条件新支付；同 requestId 不重复扣费。
    T1 payment 已提交 charge P1，但响应丢失；caller 标 failed，重试换 requestId，提交 P2。D1 同 order O1 有两笔扣费。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "识别超时不等于未扣费，指出 caller failed/换 ID 与 C1 冲突及两笔扣费副作用。"
    - "用 T1/D1 构造结果未知、恢复查询和单次扣费判据，不能仅建议重试。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
