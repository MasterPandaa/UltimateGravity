id: domain-method-control
title: "timeout-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 timeout-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C2 deadline1000ms，queue100/connect100/read600串行实际共800ms；子调用deadline一致。T2 t800响应成功、仅O3一次提交；未给取消或超时路径。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "认可800ms在deadline内且给定一次提交，不要求全部预算相加必须等于deadline。"
    - "取消/迟到结果标未评估，不由成功路径确认超时处理完善。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
