id: domain-method-regression
title: "requirement-ambiguity-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 requirement-ambiguity-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    R1-v2：“付款后24小时可取消”（可能指付款起24h内，或满24h后）。R2：“登录后可退款”，没写匿名退款规则。R3两处同版本原文分别“金额>=100免运费”和“金额>100免运费”。R4：“付款成功事件时间起24h内（含等于）可取消”，定义完整。给R1 AMBIGUOUS/R2 MISSING_RULE/R3 CONFLICT/R4 CLEAR或据材料判定；R1列两种后果与一个判别问题，R4不得制造歧义。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
