id: domain-method-control
title: "combinatorial-testing: 正确对照与边界判定"
input:
  prompt: |
    请使用 combinatorial-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    M2 三因素 A/B/C，每个取值 {0,1}，但约束 C=1⇒B=1，目标 3-way；合法全组合为 000,010,011,100,110,111。P2 恰包含这六个组合，未执行。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "验证六个合法 triples 全覆盖，不要求非法 001/101；覆盖范围限定 M2。"
    - "区分静态模型覆盖与真实执行，无执行证据保持 NOT_RUN。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
