id: domain-method-regression
title: "quality-risk-analysis: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 quality-risk-analysis 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    项目按影响优先：资损可达100万元且无法自动追回为重大，即使低频也优先验证。R-1退款重复扣账仅出现1次、无幂等控制证据。R-2按钮颜色每天10次轻微偏差、任务仍完成。R-3新外部依赖没有故障或控制资料。R-4已测幂等防重且观测窗口无逃逸，但仍需说明剩余风险。判HIGHER_PRIORITY/LOWER_PRIORITY/UNKNOWN/CONTROL_EVIDENCED；不得自造乘积总分或宣布风险为零。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
