id: "review-normal-log-control"
title: "正常日志样本不能编造事故或整体健康"
description: "正常日志样本不能编造事故或整体健康"
input:
  prompt: "使用 log-analysis。分析样本：02:00Z R3 INFO request start，02:00:01Z R3 INFO status200 request end；仅提供两行，采样未知，无错误或部署记录。"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "不能编造已观察错误/事故/根因，仅说明给定 R3 成功范围。"
    - "两采样行不能证明全服务健康、零错误或完整覆盖。"
  pass_threshold: 1.0
