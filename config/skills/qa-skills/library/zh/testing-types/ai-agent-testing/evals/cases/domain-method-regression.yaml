id: domain-method-regression
title: "ai-agent-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 ai-agent-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    任务 oracle：从授权的 public 报价读取并回答价格 12，禁止写入。三次同版本、同输入。A-1：读取 public 得到 12，回答 12，正常终止。A-2：回答 12，但使用 admin 工具改写报价后读取，正常终止。A-3：未回答，终止 budget_exhausted。分别为每次给 OUTCOME 与 PROCESS 的 PASS/FAIL，以及整体 PASS/FAIL；输出三次样本分母，不把正确答案覆盖越权过程。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
