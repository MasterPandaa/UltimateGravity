id: "review-table-exception-conflict"
title: "原子规则保留表条件、例外和来源冲突"
description: "原子规则保留表条件、例外和来源冲突"
context:
  files:
    "policy.md": |-
      # Policy v2, region R, effective 2026-10-01
      | Rule | Condition | Action |
      | P1 | order total >= 100 | shipping fee 0 |
      | P2 | order total < 100 | shipping fee 5 |
      Exception P3 takes precedence over P1/P2: remote-zone orders always pay shipping fee 8.
      Tax treatment is not specified.
    "memo.md": |-
      # Memo v2, region R, effective 2026-10-01
      M1: remote-zone orders pay shipping fee 0. Supersession: not specified.
input:
  prompt: "使用 business-rule-extraction。从 policy.md 与 memo.md 抽取原子规则，两者均为所给来源且未声明替代关系。保留条件/动作/地区/日期/优先级及未知税规则。"
expect:
  must_contain:
    - "P1"
    - "P2"
    - "P3"
    - "M1"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "保留 P1 >=100 fee0、P2 <100 fee5、P3 remote-zone fee8 优先于两者，以及 policy v2/region R/2026-10-01 和表行定位。"
    - "memo M1 同地区日期 remote-zone fee0 为冲突，保留两边并向规则负责人问优先级，不能静默选一边。"
    - "税为 missing，不补含税/未税/零税，BR 条目均回链来源。"
  pass_threshold: 1.0
