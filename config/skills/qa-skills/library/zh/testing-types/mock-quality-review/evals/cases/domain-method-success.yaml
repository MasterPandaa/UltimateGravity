id: domain-method-success
title: "mock-quality-review: 领域流程与结果判定"
input:
  prompt: |
    请使用 mock-quality-review 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 PriceService.total(qty) 应调用外部 TaxPort，税率来自 {rate:number}，异常时返回 error 而非 0。
    F1 将 PriceService.total 本身替换为固定 100，再断言 total(2)==100。
    F2 外部 TaxPort stub 返回 {taxRate:0.1}，与 C1 字段不符；只提供成功 stub，无异常候选。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "指出 F1 替换被测对象导致断言不保护 total 逻辑，F2 字段漂移且未保护异常义务。"
    - "分别给保留真实 total 与 TaxPort 合同/错误对照方法，不编造真实服务响应。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
