id: domain-method-regression
title: "agent-memory-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 agent-memory-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    项目策略 M-v3：严格租户隔离；同用户最高有效版本生效；删除确认后立即不得检索。M-1：租户 A 问偏好，检索到 B/m9。M-2：A/m1 v1=短信，v2=邮件，均有效，回答仍用 v1。M-3：A/m2 删除已确认，索引仍返回 m2。M-4：A 检索自己的有效 m3 v2，未出现 B 记录。M-5：希望判定备份到期，但未给备份保留策略。逐项 FAIL/PASS/UNKNOWN。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
