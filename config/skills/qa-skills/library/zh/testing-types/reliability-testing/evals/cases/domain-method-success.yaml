id: domain-method-success
title: "reliability-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 reliability-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    S1 本项目一小时 request success SLI=首尝试成功请求/所有首尝试请求，目标>=99%。R1 首尝试1000，成功980，20次失败重试后成功；报告按1000/1000=100%判达标。
    R2 仅观测5分钟无失败，却声称全年可用性100%。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "按 S1 复算980/1000=98%未达99%，重试最终成功不能更改首尝试分母/分子。"
    - "指出 R2 短窗口外推和请求/时间口径不等价，保留全年证据缺口。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
