id: "review-reachable-null-defect"
title: "移除可达保护仍需定位实际缺陷"
description: "移除可达保护仍需定位实际缺陷"
context:
  files:
    "patch.diff": |-
      --- a/user.py
      +++ b/user.py
      @@ -1,5 +1,3 @@
       def name(repo, ident):
           u = repo.find(ident)
      -    if u is None:
      -        return None
           return u["name"]
    "user.py": |-
      def name(repo, ident):
          u = repo.find(ident)
          return u["name"]
    "contract.md": |-
      find returns a mapping with name when present and None when absent; name returns None for absent user.
input:
  prompt: "使用 code-review。审阅 orders commit bad789、patch.diff 与 user.py。给定契约中公共 find() 可能返回 None，输出定位、影响及最小修复。"
expect:
  must_contain:
    - "user.py"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "定位 user.py:3 在删除 None 保护后访问 u[\"name\"]，find() 返回 None 导致 TypeError，不能编造安全漏洞。"
    - "建议恢复保护或等价未找到处理，验证 None 与合法用户两路径。"
  pass_threshold: 1.0
