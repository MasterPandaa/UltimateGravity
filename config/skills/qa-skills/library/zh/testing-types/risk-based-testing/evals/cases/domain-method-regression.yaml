id: domain-method-regression
title: "risk-based-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 risk-based-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    窗口30min；项目必须保护重复扣账，最小验证20min（同ID重试+账务一条+余额一致），另跨租户权限必须20min，文案检查5min。R1重复扣账已逃逸资损，R2跨租户权限无验证，R3文案轻微变化。用R1/R2 MUST_PROTECT、R3 DEFER、BUDGET ESCALATE，交付具体最低证据与不能在30min内全满足的事实，不自定降级授权。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
