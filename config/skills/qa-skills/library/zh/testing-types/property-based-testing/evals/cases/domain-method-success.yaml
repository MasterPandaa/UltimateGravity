id: domain-method-success
title: "property-based-testing: 领域流程与结果判定"
input:
  prompt: |
    请使用 property-based-testing 分析以下提供的脱敏静态 fixture。仅分析材料，不执行测试或修改资产。
    完成六类输入审计，按主提示词交付来源化发现，并给出逐项预期、材料中的观察、判定理由和最小验证方法；没有问题的对照不得虚构发现。

    C1 integer list 长度0..5，sort 升序且保留元素及重复次数。G1 seed=17、版本g1，失败输入 [2,1,1]，输出 [1,2]。R1 只查有序，声称性质通过。
    收缩观察：输入 [1,1]→[1]；[1]→[1]。
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "指出有序成立而多重集失败，给 [1,1]→[1] 的最小重复反例并保留 seed17/g1。"
    - "说明收缩后仍在输入域，不能把 distinct set 相同当元素保留。"
    - "把结论限制为给定 fixture 的静态比对；保留缺少的项目证据，不声称材料未支持的真实测试通过、漏洞利用成功或 Human 已批准。"
  pass_threshold: 1.0
