id: domain-method-regression
title: "api-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 api-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    契约 v2：REST refund 成功 200，20 元只退一次；GraphQL errors 非空表示该字段失败；清理必须删除退款再删除订单。A-1：refund 200，但 GET order 累计退款仍 0。A-2：同 refund_id 两次 200，GET 累计退款 20，只有一条账务。A-3：GraphQL HTTP 200，data.refund=null 且 errors 非空。A-4：仅提供未知 gRPC 接口名称，没有 proto 或调用结果。逐项 FAIL/PASS/UNKNOWN，并列业务后置条件与清理顺序。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
