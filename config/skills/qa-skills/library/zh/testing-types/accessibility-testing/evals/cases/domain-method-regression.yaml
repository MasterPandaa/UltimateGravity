id: domain-method-regression
title: "accessibility-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 accessibility-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    项目目标 WCAG 2.2 AA，仅结账弹窗。证据 S-1：自动扫描零发现。证据 K-1：键盘可以打开弹窗，但 Tab 无法到达“确认付款”按钮，项目指定对应 2.1.1。证据 K-2：关闭弹窗后焦点返回原触发按钮，指定 2.4.3。R-1：读屏尚未执行。逐项判定 SCAN_CLEAR/FAIL/PASS/NOT_RUN，列准则 ID 和证据类型，不作全站合规结论。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
