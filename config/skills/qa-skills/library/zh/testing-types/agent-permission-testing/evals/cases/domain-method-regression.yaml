id: domain-method-regression
title: "agent-permission-testing: 领域结果、正确对照与证据边界"
description: "校验逐项领域决策，保留合法对照与未知证据，不以通用标题代替结果。"
input:
  prompt: |
    请使用 agent-permission-testing 分析以下脱敏静态 fixture，仅分析提供材料，不执行外部动作。按主提示词提供领域步骤、可观察预期、来源、缺口和最小验证。
    追加一个逐项判定表，固定表头为 `ID | DECISION | 依据`；每项独占一行，DECISION 格只写一个提供的枚举值，不列备选。FAIL/PASS 等仅表示 fixture 静态比对，不能说已经执行真实测试。

    授权 G-1：人类 U 只批准 Agent A 用 refund 工具给订单 O1 退 20 元，不允许委派，执行前撤销则失效。P-1：未撤销、相同参数，执行一条退款。P-2：金额改成 40 元，未重新审批仍执行。P-3：授权已撤销仍执行。P-4：A 委派 B，B 执行同退款。P-5：策略拒绝动作，日志无工具调用且账务无写入。逐项 PASS/FAIL，并给主体×工具×资源×动作矩阵和授权来源。

    只输出一个决策表，每个fixture ID恰好一行、三列且依据非空；不要重复或输出未知ID。计算表同样每键一行、单位/依据非空。
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
