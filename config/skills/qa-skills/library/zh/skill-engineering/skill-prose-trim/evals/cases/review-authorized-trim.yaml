id: "review-authorized-trim"
title: "授权清理必须保留契约和历史事实"
description: "授权清理必须保留契约和历史事实"
context:
  files:
    "contract.md": |-
      # Safe review
      Never send production writes.
      This PR fixed the reviewer concern and now we should keep it.
      Measured limit: one local fixture; runtime effectiveness is UNASSESSED.
      History: 2026-09-18, issue #42 recorded the schema change.
      Formal reference: https://example.test/spec/v1
    "fixtures/recorded.json": |-
      {"recorded_at":"2026-09-18","expected":"This PR is fixture payload"}
input:
  prompt: "使用 skill-prose-trim。仅授权编辑 contract.md。移除无法从当前状态理解的过程叙述，其他行全部保留，包括测量限制、日期、issue、URL 和禁止项。不得改 fixtures/recorded.json。返回 JSON {\"mode\":\"edited\"}。"
judge:
  type: "script"
  script_path: "evals/graders/review-authorized-trim.py"
  timeout_seconds: 30
