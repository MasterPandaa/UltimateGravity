id: "review-trace-and-timeout"
title: "区分 selection 缺失与基础设施超时"
description: "区分 selection 缺失与基础设施超时"
context:
  files:
    "artifacts/events.jsonl": |-
      {"case":"trigger-1","event":"agent.response","text":"useful answer"}
      {"case":"timeout-1","event":"environment.start","error":"deadline exceeded","agent_started":false}
    "artifacts/results.json": "[{\"id\":\"trigger-1\",\"status\":\"completed\",\"outcome\":\"PASS\",\"selection\":null},{\"id\":\"timeout-1\",\"status\":\"error\",\"engine_started\":false},{\"id\":\"ambiguous-1\",\"status\":\"FAIL\",\"raw_judge\":null}]"
input:
  prompt: "使用 skill-evaluation。解读 artifacts/events.jsonl 与 artifacts/results.json。超时发生于 Agent 启动前，已完成响应没有 selection 事件。逐用例给出触发/结果状态与失败归类，不新增第二评测引擎。"
expect:
  must_contain:
    - "trigger-1"
    - "timeout-1"
    - "ambiguous-1"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "trigger-1 的已完成回答不能证明选择 Skill；触发证据为 BLOCKED，不能记成负触发 PASS/FAIL。"
    - "timeout-1 启动前超时归类 Infrastructure Defect，行为证据为 BLOCKED/NOT_RUN，不能称 Skill Defect。"
    - "ambiguous-1 只有通用失败时归因保持 Unknown，下一步索取 trace/原始 judge 证据而非猜测。"
  pass_threshold: 1.0
