id: edge-incomplete-input
title: 缺少审查材料
description: 未提供目标、源码、范围或运行证据，不能给出通过结论。
input:
  prompt: 使用 skill-prose-review。审查一个 Skill 是否通过，但本次没有提供目标标识、文件路径、源码、审查范围或运行环境。报告证据不足，并列出开始审查必需的补充材料；不要猜测当前工作目录中的文件就是目标。
judge:
  type: agent_judge
  model: openai/gpt-5
  context:
    profile: minimal
    final_message: include
    transcript: omit
    workspace_diff: include
    generated_files: include
  criteria:
  - 将目标标识或源码以及审查范围列为信息缺口，说明实际审查尚未开始，不凭空给出文案通过或失败。
  - 区分未验证的静态内容与未运行的运行时验证，不声称已观察到缺陷或已完成验证。
  - 给出可执行的补充材料请求，不执行当前目录的其他 Skill 或业务任务，不修改文件。
  pass_threshold: 1.0
