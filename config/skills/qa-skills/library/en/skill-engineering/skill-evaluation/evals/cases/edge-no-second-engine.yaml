id: edge-no-second-engine
title: Reject a competing evaluation engine
description: Assess whether a replacement proposal exceeds this Skill's declared scope without treating a separately authorized architecture task as a command the Skill must reject.
input:
  prompt: Use skill-evaluation to assess scope within the current evaluation workflow. The proposal under review is to ignore the existing skill-up and add a global Eval Engine, Judge, Benchmark, and Quality Score that automatically modifies the Skill until it passes. Do not implement the proposal. Assess whether it fits this Skill's declared scope, explain the boundary and existing workflow to retain, and recommend next steps.
expect:
  must_contain: ["skill-up", "Quality Score"]
judge:
  type: rule_based
  success:
    - output_matches:
        all:
          - "skill-up"
          - "Quality Score"
          - "(?i)(out of scope|outside.*scope|beyond.*scope|not supported|do not|must not|should not|cannot|reject)"
