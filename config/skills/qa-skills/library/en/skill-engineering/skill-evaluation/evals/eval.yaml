schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/basic-success.yaml
    - evals/cases/edge-incomplete-input.yaml
    - evals/cases/edge-no-second-engine.yaml
    - evals/cases/review-comparable-runs.yaml
    - evals/cases/review-incomparable-runs.yaml
    - evals/cases/review-trace-and-timeout.yaml
  defaults:
    timeout_seconds: 180
    max_turns: 8
    expect:
      exit_code: 0

report:
  formats: [json]
