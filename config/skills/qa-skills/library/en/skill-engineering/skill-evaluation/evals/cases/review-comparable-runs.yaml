id: "review-comparable-runs"
title: "Compare pinned previous/current artifacts"
description: "Compare pinned previous/current artifacts"
context:
  files:
    "artifacts/runs.json": |-
      {
        "previous": {
          "run_id": "run-prev",
          "skill_version": "v1",
          "eval_version": "e1",
          "skill_up": "0.12.0",
          "engine": "codex",
          "model": "model-fixture",
          "parameters": {
            "temperature": 0,
            "seed": 7
          },
          "input_hash": "cases-A",
          "judge": "rubric-A",
          "environment": "sandbox-A",
          "timestamp": "2026-10-01T09:00:00Z",
          "passed": 8,
          "total": 10
        },
        "current": {
          "run_id": "run-current",
          "skill_version": "v2",
          "eval_version": "e1",
          "skill_up": "0.12.0",
          "engine": "codex",
          "model": "model-fixture",
          "parameters": {
            "temperature": 0,
            "seed": 7
          },
          "input_hash": "cases-A",
          "judge": "rubric-A",
          "environment": "sandbox-A",
          "timestamp": "2026-10-02T09:00:00Z",
          "passed": 6,
          "total": 10
        }
      }
input:
  prompt: "Use skill-evaluation. Interpret artifacts/runs.json as a previous/current evaluation report. Do not run an engine. State the comparison type, factual pass-rate change, comparability basis, uncertainty, and evidence needed before a release conclusion."
expect:
  must_contain:
    - "run-prev"
    - "run-current"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "Classifies this as Version Regression, not a with/without benchmark, and cites run-prev/run-current and the pinned model, input, judge, and environment."
    - "Computes 8/10=80% and 6/10=60%, a decrease of 20 percentage points; does not confuse this with a 20% relative change (relative decrease is 25%)."
    - "Treats the observed case-result decrease as evidence limited to these ten cases and samples, with no production/business approval or statistically established general degradation."
  pass_threshold: 1.0
