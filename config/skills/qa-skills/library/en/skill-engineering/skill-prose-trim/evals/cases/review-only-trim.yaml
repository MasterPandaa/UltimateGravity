id: "review-only-trim"
title: "Review-only mode distinguishes proposals from edits"
description: "Review-only mode distinguishes proposals from edits"
context:
  files:
    "contract.md": |-
      # Safe review
      Never send production writes.
      This PR fixed the reviewer concern and now we should keep it.
      Measured limit: one local fixture; runtime effectiveness is UNASSESSED.
      History: 2026-09-18, issue #42 recorded the schema change.
      Formal reference: https://example.test/spec/v1
    "fixtures/recorded.json": |-
      {"recorded_at":"2026-09-18","expected":"This PR is fixture payload"}
input:
  prompt: "Use skill-prose-trim. Audit contract.md without editing any file. Give a proposed before/after change only for process residue, enumerate preserved lines, and explain why the recorded fixture must remain untouched. Include the original date, issue ID, formal URL and measured status in the preserved-content report so each can be checked; refer to the recorded payload only to explain its protection, without cleaning or changing it."
expect:
  must_contain:
    - "contract.md"
    - "2026-09-18"
    - "UNASSESSED"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "Selects only line 3 for deletion and explicitly describes this as a proposal, not a completed file edit."
    - "Preserves production-write prohibition, UNASSESSED one-fixture limit, 2026-09-18 / issue #42 history, and formal URL."
    - "Does not remove the phrase This PR from fixtures/recorded.json because it is recorded payload, not document process residue."
  pass_threshold: 1.0
