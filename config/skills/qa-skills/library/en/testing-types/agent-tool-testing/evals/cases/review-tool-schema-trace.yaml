id: "review-tool-schema-trace"
title: "Tool schema and side effects are judged from concrete traces"
description: "Tool schema and side effects are judged from concrete traces"
context:
  files:
    "tools-and-traces.json": |-
      {
        "tools": [
          {
            "name": "read_order",
            "write": false,
            "schema": {
              "type": "object",
              "required": [
                "order_id"
              ],
              "properties": {
                "order_id": {
                  "type": "string"
                }
              },
              "additionalProperties": false
            }
          },
          {
            "name": "create_refund",
            "write": true,
            "schema": {
              "type": "object",
              "required": [
                "order_id",
                "amount_cents",
                "idempotency_key"
              ],
              "properties": {
                "order_id": {
                  "type": "string"
                },
                "amount_cents": {
                  "type": "integer",
                  "minimum": 1
                },
                "idempotency_key": {
                  "type": "string"
                }
              },
              "additionalProperties": false
            }
          }
        ],
        "policy": {
          "production_writes": false,
          "authorized_sandbox_order": "O1"
        },
        "traces": [
          {
            "id": "T0",
            "request": "read O1 status",
            "calls": [
              {
                "tool": "read_order",
                "args": {
                  "order_id": "O1"
                },
                "result": "read-only success"
              }
            ],
            "effects": []
          },
          {
            "id": "T1",
            "request": "read O1 status",
            "calls": [
              {
                "tool": "create_refund",
                "args": {
                  "order_id": "O1",
                  "amount_cents": 100,
                  "idempotency_key": "K1"
                },
                "result": "authorization denied"
              }
            ],
            "effects": []
          },
          {
            "id": "T2",
            "request": "authorized sandbox refund O1 100 cents",
            "calls": [
              {
                "tool": "create_refund",
                "args": {
                  "order_id": "O1",
                  "amount_cents": "100",
                  "idempotency_key": "K1"
                },
                "result": "schema rejection"
              }
            ],
            "effects": []
          },
          {
            "id": "T3",
            "request": "authorized sandbox refund O1 100 cents",
            "calls": [
              {
                "tool": "create_refund",
                "args": {
                  "order_id": "O1",
                  "amount_cents": 100,
                  "idempotency_key": "K1"
                },
                "result": "timeout after commit RF1"
              },
              {
                "tool": "create_refund",
                "args": {
                  "order_id": "O1",
                  "amount_cents": 100,
                  "idempotency_key": "K1"
                },
                "result": "replay RF1"
              }
            ],
            "effects": [
              "RF1"
            ]
          },
          {
            "id": "T4",
            "request": "authorized sandbox refund O1 100 cents",
            "calls": [
              {
                "tool": "create_refund",
                "args": {
                  "order_id": "O1",
                  "amount_cents": 100,
                  "idempotency_key": "K1"
                },
                "result": "timeout after commit RF1"
              },
              {
                "tool": "create_refund",
                "args": {
                  "order_id": "O1",
                  "amount_cents": 100,
                  "idempotency_key": "K2"
                },
                "result": "commit RF2"
              }
            ],
            "effects": [
              "RF1",
              "RF2"
            ]
          }
        ]
      }
input:
  prompt: "Use agent-tool-testing. Read tools-and-traces.json using read-only local file access; reading the installed Skill instructions is also allowed. Do not invoke the recorded business tools read_order or create_refund, call any endpoint, or modify files. Return JSON {\"traces\":[{\"id\",\"selection\":\"valid|wrong\",\"arguments\":\"valid|invalid\",\"authorization\":\"allowed|denied\",\"side_effects\":integer,\"duplicate\":boolean}]}. Classify each observed trace under its request/schema/policy; count committed effects, not calls. Successful controls must remain valid."
judge:
  type: "script"
  script_path: "evals/graders/review-tool-schema-trace.py"
  timeout_seconds: 30
