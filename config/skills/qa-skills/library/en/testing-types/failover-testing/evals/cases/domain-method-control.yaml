id: domain-method-control
title: "failover-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use failover-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C1 partitions allow one writer; A must be fenced before switching to B. Business RTO<=20 s.
    C2 is C1. T2 t0 partition; t4 A fenced/writes rejected; t5 B granted write authority; t8 business ready. Ledger O1=10, no conflicting writes. Planned failback requires replication catch-up and revoking B first; not executed.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept T2's fencing order/RTO 8 s and distinguish supplied failover material from unexecuted failback."
    - "Do not claim all partitions, zero loss or completed failback validation."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
