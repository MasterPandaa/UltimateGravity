id: "review-paired-deltas"
title: "Paired repeats separate consistent shifts from zero-median variation"
description: "Paired repeats separate consistent shifts from zero-median variation"
context:
  files:
    "paired.json": |-
      {
        "identity": {
          "environment": "perf-A",
          "workload": "100RPS-read",
          "data_hash": "D1",
          "builds": [
            "B1",
            "B2"
          ],
          "metric": "p95_ms"
        },
        "groups": {
          "stable": [
            {
              "id": "P1",
              "baseline": 100,
              "candidate": 120
            },
            {
              "id": "P2",
              "baseline": 102,
              "candidate": 122
            },
            {
              "id": "P3",
              "baseline": 98,
              "candidate": 118
            }
          ],
          "variable": [
            {
              "id": "N1",
              "baseline": 90,
              "candidate": 110
            },
            {
              "id": "N2",
              "baseline": 110,
              "candidate": 90
            },
            {
              "id": "N3",
              "baseline": 100,
              "candidate": 100
            }
          ]
        }
      }
input:
  prompt: "Use performance-regression-analysis. Read paired.json. Return JSON {\"groups\":[{\"id\",\"comparable\":boolean,\"median_absolute_ms\",\"median_baseline_ms\",\"median_candidate_ms\",\"relative_change_pct\",\"classification\":\"consistent_observed_degradation|inconclusive_variation\"}]}. Use the median paired delta; relative change=(median candidate-median baseline)/median baseline*100. Classifications describe this sample only, not significance or business acceptance."
judge:
  type: "script"
  script_path: "evals/graders/review-paired-deltas.py"
  timeout_seconds: 30
