id: domain-method-control
title: "recovery-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use recovery-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C1 RTO<=30 s from failure to order read/write readiness; RPO<=5 s; orders in the restored interval must be unique and retain source amounts.
    C2 is C1. T2 failure t100, business t120, recovered point t98; source/restored O1=10, O2=20, unique IDs, reconciliation interval explicitly through t98. Static fixture only, no drill run.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept RTO 20 s/RPO 2 s and interval consistency without imposing zero loss."
    - "Keep post-t98 compensation/live recovery unverified; matching material is not a passed drill."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
