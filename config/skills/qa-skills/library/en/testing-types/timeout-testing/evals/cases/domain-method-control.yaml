id: domain-method-control
title: "timeout-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use timeout-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C2 deadline 1000 ms; serial queue 100/connect 100/read 600 actual total 800 ms; children share deadline. T2 successful response at t800, one O3 commit; no cancellation/timeout path supplied.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept 800 ms within deadline/one commit; budgets need not sum exactly to the deadline."
    - "Leave cancellation/late-result paths unassessed rather than establishing timeout handling from success."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
