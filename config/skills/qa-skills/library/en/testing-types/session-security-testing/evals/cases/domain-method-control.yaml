id: domain-method-control
title: "session-security-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use session-security-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C2 access tokens live 30 s; logout immediately revokes refresh only; issued access remains until expiry and the project accepts that window. T2 t0 issues A/R, t10 logout makes R rejected; A@20 allowed, A@30 rejected. No Cookie mechanism supplied.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept A@20 and refresh revocation under C2 rather than imposing opaque-session immediate revocation."
    - "Scope to supplied mechanism/window without inferring Cookie attributes or overall session security."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
