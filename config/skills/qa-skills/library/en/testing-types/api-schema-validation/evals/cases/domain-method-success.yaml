id: domain-method-success
title: "api-schema-validation: Domain procedure and result oracle"
input:
  prompt: |
    Use api-schema-validation to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    S1 JSON Schema 2020-12: {"type":"object", "properties":{"id":{"type":"integer"}, "note":{"type":["string", "null"]}}, "required":["id", "note"], "additionalProperties": false}.
    A={"id":1, "note": null}; B={"id":1}; C={"id":1, "note":"ok", "extra":0}. R1 labels A invalid and B/C valid.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Judge A valid, B invalid under required, C invalid under additionalProperties; identify R1's three conflicts."
    - "Explain that null is allowed and required checks presence, without adding a nonempty rule."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
