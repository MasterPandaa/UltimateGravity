id: domain-method-control
title: "resilience-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use resilience-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C1 recommendation failure permits hidden recommendations but checkout remains available; one charge per order; recommendations return within 30 s of dependency recovery.
    C2 is C1. T2 hides recommendations during failure, checkout succeeds/O2 charged once; dependency recovers t100 and recommendations t120; subsequent ledger consistent. Only this partial-dependency fixture.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept phase invariants/recovery 20 s under C2; allowed degradation is not an availability defect."
    - "Scope conclusions to this scenario, without all-fault resilience or long-term reliability claims."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
