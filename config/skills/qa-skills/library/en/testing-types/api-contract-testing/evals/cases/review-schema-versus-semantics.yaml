id: "review-schema-versus-semantics"
title: "Unchanged integer schema can break old consumer semantics"
description: "Unchanged integer schema can break old consumer semantics"
context:
  files:
    "old-schema.json": "{\"type\": \"object\", \"required\": [\"amount\", \"currency\"], \"properties\": {\"amount\": {\"type\": \"integer\", \"description\": \"USD major units\"}, \"currency\": {\"type\": \"string\", \"enum\": [\"USD\"]}}, \"additionalProperties\": true}"
    "new-schema.json": "{\"type\": \"object\", \"required\": [\"amount\", \"currency\"], \"properties\": {\"amount\": {\"type\": \"integer\", \"description\": \"USD cents, minor units\"}, \"currency\": {\"type\": \"string\", \"enum\": [\"USD\"]}}, \"additionalProperties\": true}"
    "old-client.py": |-
      # Consumer C1, version 1
      def provider_cents(body):
          return body["amount"] * 100
    "response.json": "{\"amount\":1000,\"currency\":\"USD\"}"
input:
  prompt: "Use api-contract-testing. Compare old-schema.json, new-schema.json and old-client.py. Both schemas allow the example integer value. Review syntax versus amount semantics for old consumer C1, compute the consequence for the supplied response, and identify migration evidence."
expect:
  must_contain:
    - "C1"
    - "amount"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "States structural/type compatibility for amount integer but semantic incompatibility from major units to cents; cites the descriptions and C1 multiplication."
    - "For new response amount=1000, old client produces 100000 provider cents instead of 1000, a 100x amount; does not claim a real charge occurred."
    - "Migration behavior remains unknown because no adapter/version rollout is supplied; proposes pinned old-consumer contract tests and explicit unit/version mapping."
  pass_threshold: 1.0
