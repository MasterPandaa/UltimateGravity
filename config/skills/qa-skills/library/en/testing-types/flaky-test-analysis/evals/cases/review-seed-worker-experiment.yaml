id: "review-seed-worker-experiment"
title: "Flaky ratios and minimal experiments keep quarantine visible"
description: "Flaky ratios and minimal experiments keep quarantine visible"
context:
  files:
    "runs.csv": |-
      run,seed,worker,status
      1,7,2,FAIL
      2,7,2,PASS
      3,7,2,FAIL
      4,7,2,PASS
      5,7,1,PASS
      6,7,1,PASS
      7,8,2,PASS
      8,8,2,PASS
      9,8,1,PASS
      10,8,1,PASS
input:
  prompt: "Use flaky-test-analysis. Analyze runs.csv for test F1 on build B34, same environment. Quarantine is proposed by owner Lin until 2026-10-09, with exit criterion zero failures in 30 controlled repetitions. Do not execute reruns. Report evidence, competing explanations, smallest discriminator and quality-report impact."
expect:
  must_contain:
    - "F1"
    - "Lin"
    - "2026-10-09"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "Computes 2/10=20% overall, 2/4=50% seed7/worker2, 0/2 for each other supplied cell; correlations do not establish seed or parallelism as root cause."
    - "Proposes controlled seed7 worker1 versus worker2 with fixed fixture/environment and repeated counts, plus a discriminating shared-state/race observation rather than blind retries."
    - "Quarantine includes Lin, 2026-10-09 and 30-run exit evidence; original failures and coverage limitation stay in quality reports, not hidden as passed."
  pass_threshold: 1.0
