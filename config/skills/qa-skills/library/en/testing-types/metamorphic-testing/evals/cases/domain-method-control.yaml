id: domain-method-control
title: "metamorphic-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use metamorphic-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C2 first(list) returns the first element of a nonempty list; [1, 2]→1, permutation [2, 1]→2. P2 proposes equal outputs under permutation without a relation contract.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Reject P2's semantic-changing permutation, not the correct 1/2 implementation outputs."
    - "Request a valid relation/preconditions or mark this relation inapplicable."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
