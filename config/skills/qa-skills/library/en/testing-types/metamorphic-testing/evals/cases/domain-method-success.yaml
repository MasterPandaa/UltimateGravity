id: domain-method-success
title: "metamorphic-testing: Domain procedure and result oracle"
input:
  prompt: |
    Use metamorphic-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C1 sort accepts integer lists, ascending while preserving multiplicity; for any permutation T, sort(T(x))=sort(x).
    F1 x=[2, 1, 1]→[1, 1, 2]; T(x)=[1, 2, 1]→[1, 2]. P1 compares only distinct sets and calls the relation satisfied.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Identify the missing duplicate 1/unequal outputs; equal distinct sets do not satisfy C1."
    - "Use duplicate-preserving permutation oracles/counterexamples rather than inventing deduplication equivalence."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
