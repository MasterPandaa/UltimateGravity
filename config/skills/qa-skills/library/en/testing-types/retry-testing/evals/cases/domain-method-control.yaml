id: domain-method-control
title: "retry-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use retry-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C2 side-effect-free GET, at most 3 total attempts/deadline 2000 ms; HTTP Retry-After=1 on 503 means wait 1 second after receiving the response.
    T3 t0 call→503 in 100 ms, t1100 retry→200 in 100 ms; 2 attempts/1200 ms. No nested retries; 400 path absent.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept 1000 ms from response t100 to retry t1100 and the 2-attempt/1200 ms budget; HTTP Retry-After is not milliseconds or measured from request start."
    - "Retain permanent-error/jitter/cancellation gaps rather than passing the whole strategy."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
