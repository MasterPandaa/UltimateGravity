id: domain-method-success
title: "ui-test-strategy: Domain procedure and result oracle"
input:
  prompt: |
    Use ui-test-strategy to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C1 desktop/mobile checkout requires correct totals, one API order, UI submission through confirmation ID, keyboard operation and approved layout. P1 has 10 screenshots only, claiming full checkout coverage; no other runs.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Explain screenshot relevance to appearance only, not totals, single orders, confirmation flow or keyboard obligations."
    - "Allocate component totals, integration orders, minimal E2E, visual/accessibility candidates by platform/state with residual risks."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
