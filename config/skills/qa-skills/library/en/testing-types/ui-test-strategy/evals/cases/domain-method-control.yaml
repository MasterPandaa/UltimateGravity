id: domain-method-control
title: "ui-test-strategy: Correct control and boundary decisions"
input:
  prompt: |
    Use ui-test-strategy to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C2 changes only price-format component, not API/journey; obligations cover empty/negative/valid amounts, desktop/mobile layout and accessible label. P2 component format assertions+two-platform visual+label checks; existing checkout E2E reused as an unrun regression recommendation, no new execution claim.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept the scoped minimum layers without requiring a new E2E for every format value."
    - "Keep reused E2E unrun/label checks narrower than full accessibility, with applicability limits."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
