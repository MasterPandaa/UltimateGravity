id: domain-method-control
title: "security-requirement-review: Correct control and boundary decisions"
input:
  prompt: |
    Use security-requirement-review to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    S2 internal project Policy-X v3 allows invoice reads only by same-tenant owners. R3 same-tenant owner allowed; nonowner/foreign tenant→403 without invoice fields; server-side subject/resource checks; isolated acceptance records subject/resource/status/redacted response; owner=API team. Requirements/plan only.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept R3's testability and allow/deny criteria for this obligation without imposing an unsupplied algorithm/standard."
    - "Keep execution/full-standard conformity unknown; testable is not security-passed."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
