id: "review-table-exception-conflict"
title: "Atomic rules preserve table conditions, exception and source conflict"
description: "Atomic rules preserve table conditions, exception and source conflict"
context:
  files:
    "policy.md": |-
      # Policy v2, region R, effective 2026-10-01
      | Rule | Condition | Action |
      | P1 | order total >= 100 | shipping fee 0 |
      | P2 | order total < 100 | shipping fee 5 |
      Exception P3 takes precedence over P1/P2: remote-zone orders always pay shipping fee 8.
      Tax treatment is not specified.
    "memo.md": |-
      # Memo v2, region R, effective 2026-10-01
      M1: remote-zone orders pay shipping fee 0. Supersession: not specified.
input:
  prompt: "Use business-rule-extraction. Extract atomic rules from policy.md and memo.md. Treat both as supplied sources with their declared scope; neither declares supersession. Keep conditions/actions/region/date/precedence and unknown tax rules visible."
expect:
  must_contain:
    - "P1"
    - "P2"
    - "P3"
    - "M1"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "Extracts P1 >=100 fee0, P2 <100 fee5, and P3 remote-zone fee8 overriding both, with policy v2/region R/2026-10-01 scope and row locators."
    - "Preserves conflicting memo M1 remote-zone fee0 in the same region/date and asks the policy owner for precedence; does not select one silently."
    - "Tax remains missing rather than invented inclusive/exclusive or zero tax; every BR entry traces to source evidence."
  pass_threshold: 1.0
