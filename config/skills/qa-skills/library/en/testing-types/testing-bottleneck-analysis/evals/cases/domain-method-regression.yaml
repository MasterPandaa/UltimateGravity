id: domain-method-regression
title: "testing-bottleneck-analysis: Domain outcomes, correct controls, and evidence boundaries"
description: "Checks per-item domain decisions, legitimate controls, and unknown evidence rather than generic headings."
input:
  prompt: |
    Use testing-bottleneck-analysis to analyze this sanitized static fixture, without external actions. Follow the main prompt with domain steps, observable oracles, sources, gaps, and minimal validation.
    Append a decision table with columns `ID | DECISION | Evidence`; give one row per ID and exactly one supplied enum value in the DECISION cell. FAIL/PASS denotes comparison of this fixture only, not a real test execution.

    T1 arrives at0min, waits for environment0–40, executes40–50, reworks50–60, completes60; runner is idle while waiting. B1 identifies the largest phase. Matched daily tasks:concurrency2 completes10/hour withWIP4;concurrency4 completes6/hour withWIP8 and increasedDB lock waits. B2 claims more concurrency always helps. B3 calls40min waiting proof of understaffing. B4 proposes DB contention requiring controlled confirmation. Decide DEPENDENCY_WAIT/UNSUPPORTED/HYPOTHESIS, separating10min execution and10min rework from60min cycle.
    Report calculations in a separate `METRIC | VALUE | Unit/evidence` table using these METRIC keys: dependency_wait_minutes, execution_minutes, rework_minutes. VALUE contains only the number.

    Output exactly one decision table, each fixture ID once, exactly three cells and nonempty evidence; no duplicates or unknown IDs. Calculation keys likewise occur once with nonempty units/evidence.
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
