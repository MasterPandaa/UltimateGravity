id: domain-method-regression
title: "performance-test-jmeter: Domain outcomes, correct controls, and evidence boundaries"
description: "Checks per-item domain decisions, legitimate controls, and unknown evidence rather than generic headings."
input:
  prompt: |
    Use performance-test-jmeter to analyze this sanitized static fixture, without external actions. Follow the main prompt with domain steps, observable oracles, sources, gaps, and minimal validation.
    Append a decision table with columns `ID | DECISION | Evidence`; give one row per ID and exactly one supplied enum value in the DECISION cell. FAIL/PASS denotes comparison of this fixture only, not a real test execution.

    Synthetic baseline: JMeter 5.6.3/JDK 17, local fixture only; supplied gates p95<=200ms and error<=1%; CSV reuse forbidden. J-1 claims 10 RPS from 10 threads without timers or measured throughput. J-2 consumes 10 rows from a 5-row CSV with recycle=true. J-3 has 100 JTL samples, 2 failures, p95=250ms and process exit 0. J-4 has 100 samples, no failures, p95=150ms, enough non-reused CSV rows and valid business assertions. Decide UNSUPPORTED/FAIL/PASS, giving the non-GUI entry and plugin/distributed prerequisites.

    Output exactly one decision table, each fixture ID once, exactly three cells and nonempty evidence; no duplicates or unknown IDs. Calculation keys likewise occur once with nonempty units/evidence.
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
