id: domain-method-success
title: "chaos-testing: Domain procedure and result oracle"
input:
  prompt: |
    Use chaos-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    H1 isolated staging studies one-instance failure on checkout. Baseline 30 s error rate=0%; control has no injection; invariant: no duplicate orders.
    P1 proposes stopping all database nodes for 10 min, with only "stop on anomalies", no measurable threshold/cadence/stop owner/recovery steps. No run evidence.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Identify all-node scope conflicting with H1 and unmeasurable stopping/missing recovery; mark readiness blocked."
    - "Do not invent thresholds or claim injection/recovery; provide a card with required missing evidence."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
