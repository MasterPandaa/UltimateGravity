id: domain-method-control
title: "chaos-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use chaos-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    H2 staging: one instance, <=5% traffic, <=30 s. Stop on any duplicate order or >2% errors over 30 s; observe every 5 s, on-call QA owns stopping. Remove fault and reconcile ledger/return to baseline; separate no-injection control. Design only.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept H2's reviewable scope/stop/recovery design without imposing another fault or threshold."
    - "Retain NOT_RUN; readiness is neither a passed safe experiment nor production-injection authority."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
