id: domain-method-control
title: "boundary-value-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use boundary-value-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C2 duration is integer seconds in [0, 10). T2 rejects -1, accepts 0/1/9, rejects 10/11. Minimum step for another decimal ratio is absent.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept rejection at exclusive 10 and acceptance at inclusive 0."
    - "Leave ratio neighbors open/symbolic rather than borrowing the seconds step."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
