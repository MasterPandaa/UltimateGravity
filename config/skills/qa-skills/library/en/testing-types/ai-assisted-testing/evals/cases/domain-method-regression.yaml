id: domain-method-regression
title: "ai-assisted-testing: Domain outcomes, correct controls, and evidence boundaries"
description: "Checks per-item domain decisions, legitimate controls, and unknown evidence rather than generic headings."
input:
  prompt: |
    Use ai-assisted-testing to analyze this sanitized static fixture, without external actions. Follow the main prompt with domain steps, observable oracles, sources, gaps, and minimal validation.
    Append a decision table with columns `ID | DECISION | Evidence`; give one row per ID and exactly one supplied enum value in the DECISION cell. FAIL/PASS denotes comparison of this fixture only, not a real test execution.

    Same 10 checkout cases: manual baseline 60 minutes; AI generation 10, review 25, rework 35, acceptance 10. I-1: sanitized input, QA R1 reviews D1 assertions, adopted V2 executes and acceptance is 10/10. I-2: D2 is called adopted without Human review. I-3: team claims total time improved using generation time alone. Decide I-1/I-2 ACCEPTED/DRAFT, I-3 UNSUPPORTED/SUPPORTED, showing total labor and provenance.

    Output exactly one decision table, each fixture ID once, exactly three cells and nonempty evidence; no duplicates or unknown IDs. Calculation keys likewise occur once with nonempty units/evidence.
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
