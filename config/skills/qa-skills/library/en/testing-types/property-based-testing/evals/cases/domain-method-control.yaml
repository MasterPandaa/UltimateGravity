id: domain-method-control
title: "property-based-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use property-based-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C2 sort accepts integer lists length 0..5, ascending and multiset-preserving. F2 []→[], [2, 1, 1]→[1, 1, 2], [-1, 0]→[-1, 0]. Only three samples; seed/generator version absent.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept both properties for all three samples without inventing counterexamples."
    - "Retain replay/generation-coverage gaps; three samples do not establish all-input validity."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
