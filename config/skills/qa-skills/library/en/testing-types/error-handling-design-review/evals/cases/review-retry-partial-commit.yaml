id: "review-retry-partial-commit"
title: "Retry classes preserve commit and layered propagation"
description: "Retry classes preserve commit and layered propagation"
context:
  files:
    "errors.md": |-
      # Failure design v3
      E1 invalid quantity: caller gets 400 VALIDATION, no retry.
      E2 denied scope: 403 FORBIDDEN, no retry.
      E3 provider unavailable before commit: 503 TEMPORARY, retry same key at most 2 times with 1s backoff.
      T4: provider span S4 commits debit C4 with key K4 then response times out; gateway request R4 maps it to 504 OUTCOME_UNKNOWN. Retry must reuse K4 and query operation state first.
      Compensation for committed debit: contract not supplied; Human authorization required for real writes.
input:
  prompt: "Use error-handling-design-review. Review errors.md. For each supplied mode, state retry eligibility, caller contract, idempotency/compensation and telemetry evidence. The same timeout appears at provider and gateway layers; preserve its propagation identity."
expect:
  must_contain:
    - "C4"
    - "S4"
    - "R4"
    - "K4"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "Validation E1 and auth E2 are non-retryable; temporary E3 is retryable only under supplied backoff/idempotency budget, not an invented unlimited retry."
    - "T4 timeout after committed debit C4 is an unknown client outcome, not proven failure: query by idempotency key before reissuing; compensation requires reconciliation/authorization, not blindly issuing another debit."
    - "Preserves provider span S4 -> gateway request R4 as one propagated failure chain and keeps missing compensation contract as a gap."
  pass_threshold: 1.0
