id: domain-method-regression
title: "requirement-consistency-analysis: Domain outcomes, correct controls, and evidence boundaries"
description: "Checks per-item domain decisions, legitimate controls, and unknown evidence rather than generic headings."
input:
  prompt: |
    Use requirement-consistency-analysis to analyze this sanitized static fixture, without external actions. Follow the main prompt with domain steps, observable oracles, sources, gaps, and minimal validation.
    Append a decision table with columns `ID | DECISION | Evidence`; give one row per ID and exactly one supplied enum value in the DECISION cell. FAIL/PASS denotes comparison of this fixture only, not a real test execution.

    Dictionary v2: member is the alias of the supplied membership term; cents=currency units×100. C-1 same v2 limit 100 units versus 10000 cents. C-2 same v2 refund limit 100 versus120 units. C-3 'active' means v1 account state in one source and v2 subscription state in another, with no identity/migration mapping. C-4 v2 state dictionary explicitly maps done=refunded. Decide EQUIVALENT/CONTRADICTED/NOT_COMPARABLE with unit/version/entity evidence; wording differences or cross-version names alone are no contradiction.

    Output exactly one decision table, each fixture ID once, exactly three cells and nonempty evidence; no duplicates or unknown IDs. Calculation keys likewise occur once with nonempty units/evidence.
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/fixtures/check_domain_decisions.py
  timeout_seconds: 10
