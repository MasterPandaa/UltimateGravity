id: domain-method-success
title: "decision-table-testing: Domain procedure and result oracle"
input:
  prompt: |
    Use decision-table-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    B1 boolean member/coupon: 00→full, 01→coupon10, 10→member20, 11→member20. Discounts do not stack.
    P1 includes only 00/01/10, with 01→member20, and no 11.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Show four combinations; identify incorrect 01 action and missing 11; 10/11 may compress as member=true/coupon=don't-care under B1."
    - "Do not invent discount rates or precedence."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
