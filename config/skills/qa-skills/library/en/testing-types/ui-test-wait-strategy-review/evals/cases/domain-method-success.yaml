id: domain-method-success
title: "ui-test-wait-strategy-review: Domain procedure and result oracle"
input:
  prompt: |
    Use ui-test-wait-strategy-review to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C1 Submit completes when the current orderId.status=confirmed, budget 2000 ms; page has a persistent WebSocket. T1 idle never occurs; another trace is idle at t100 while order pending, confirmed at t800. P1 treats idle as success and clicks Submit again on wait failure.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Identify persistent-connection idle mismatch, t100 pending despite idle, and repeated-submit side-effect risk."
    - "Wait for this orderId.confirmed within 2000 ms using read-only observation; do not call t100 business-complete."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
