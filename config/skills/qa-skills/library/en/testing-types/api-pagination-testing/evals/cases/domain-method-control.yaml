id: domain-method-control
title: "api-pagination-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use api-pagination-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C2 is a live offset API with no cross-page snapshot guarantee, pageSize=2, id asc. At t0 data=[1, 2, 3, 4], P1=[1, 2]. After deletion of 1, t1 data=[2, 3, 4], offset 2→[4], next=null. No snapshot-consistency obligation is supplied.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Explain that offset shifting after deletion omits 3, without claiming a violated snapshot contract."
    - "Retain the consumer's no-loss need as an open requirement and label snapshot support as a proposal."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
