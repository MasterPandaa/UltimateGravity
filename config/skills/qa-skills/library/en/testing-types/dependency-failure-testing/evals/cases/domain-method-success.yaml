id: domain-method-success
title: "dependency-failure-testing: Domain procedure and result oracle"
input:
  prompt: |
    Use dependency-failure-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C1 Checkout calls payment synchronously. Timeout leaves order pending and requires status reconciliation by payment requestId before another payment; same requestId must not duplicate charges.
    T1 payment commits P1 but loses response; caller marks failed, retries with a new requestId and commits P2. D1 has two charges for order O1.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Explain timeout is not no-payment; trace failed state/new ID and duplicate charges to C1/T1/D1."
    - "Derive uncertain-outcome, reconciliation and single-charge oracles rather than recommending unconditional retry."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
