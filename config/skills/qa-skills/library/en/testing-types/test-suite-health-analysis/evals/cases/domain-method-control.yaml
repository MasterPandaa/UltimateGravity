id: domain-method-control
title: "test-suite-health-analysis: Correct control and boundary decisions"
input:
  prompt: |
    Use test-suite-health-analysis to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    R2 buildC/dataE:40 first-attempt passes, no retries/quarantine; mapping covers this change's4 obligations, duration 8 min, budget 10 min. One run only; report scopes metrics to this run, leaving long-term stability unassessed.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept 40/40 first-pass, no retries, and 8 min<=10 min without inventing scores/quarantine issues."
    - "Retain one-run limits for long-term stability/future changes."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
