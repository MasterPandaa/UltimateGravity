id: domain-method-control
title: "combinatorial-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use combinatorial-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    M2 factors A/B/C each in {0, 1}, constraint C=1⇒B=1, target 3-way. Legal assignments=000, 010, 011, 100, 110, 111. P2 contains exactly these six and has not run.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Verify all six legal triples, without requiring illegal 001/101; scope coverage to M2."
    - "Separate model coverage from live execution and retain NOT_RUN."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
