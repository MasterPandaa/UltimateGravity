id: domain-method-success
title: "reliability-testing: Domain procedure and result oracle"
input:
  prompt: |
    Use reliability-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    S1 hourly request-success SLI=successful first attempts/all first attempts, target>=99%. R1 first attempts=1000, successes=980; 20 failed requests succeed on retries. Report uses 1000/1000=100% to pass.
    R2 observes 5 min with no failures but claims 100% yearly availability.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Recalculate 980/1000=98%, below 99%; retry success cannot change first-attempt numerator/denominator."
    - "Reject R2's short-window extrapolation/request-time substitution, retaining missing yearly evidence."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
