id: domain-method-control
title: "state-transition-testing: Correct control and boundary decisions"
input:
  prompt: |
    Use state-transition-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    M1 initially DRAFT; submit with qty>0→SUBMITTED; successful pay→PAID with one charge; DRAFT cannot ship; failed pay stays SUBMITTED with no charge.
    M2 is M1. T4 qty 0 submit rejected/staysDRAFT; qty 1→SUBMITTED; failed pay staysSUBMITTED/no charge; successful pay→PAID/one charge. No rule for ship after PAID.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Accept guard and successful/failed-pay controls; leave post-PAID ship unknown instead of adding an edge."
    - "Scope conclusions to supplied cells without claiming all transitions ran."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
