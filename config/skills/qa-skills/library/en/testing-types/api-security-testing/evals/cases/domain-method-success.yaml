id: domain-method-success
title: "api-security-testing: Domain procedure and result oracle"
input:
  prompt: |
    Use api-security-testing to analyze the supplied redacted static fixture. Analyze material only; do not execute tests or edit assets.
    Complete the six-part input audit and sourced findings required by the main prompt. Show expected behavior, observations in the material, decision reasons, and minimal validation for each item; do not invent findings for correct controls.

    C1 GET /invoices/{id} allows only its owner within the same tenant; PATCH may change memo, not owner/tenant; list pageSize<=50.
    D1 pseudocode: get(id, user) directly findById(id) with no owner/tenant check; patch merges the entire body into row; list has no pageSize bound. Static code only, no runtime responses.
expect:
  exit_code: 0
judge:
  type: agent_judge
  model: openai/gpt-5
  criteria:
    - "Map object permission, protected-field writes, and unbounded pages to C1/D1, with allow/deny controls."
    - "Keep findings static; do not claim successful cross-tenant access or invent exploit responses."
    - "Limit conclusions to static comparison of the supplied fixture; preserve missing project evidence and do not claim an unsupplied real-test pass, exploit success, or Human approval."
  pass_threshold: 1.0
