input:
  prompt: "Use multi-role-quality-synthesis. Synthesize reports.json only when its stages permit a reliable single-stage conclusion. Preserve the input source register even if blocked."
expect:
  must_contain:
    - "qa-1"
    - "tech-1"
    - "product-1"
judge:
  type: "agent_judge"
  model: "openai/gpt-5"
  context:
    profile: "minimal"
    final_message: "include"
    transcript: "omit"
    workspace_diff: "include"
    generated_files: "include"
  criteria:
    - "Detects test-strategy versus test-report-review, blocks a combined conclusion, lists the conflicting stage/source pairs, and asks to split by stage."
    - "Keeps all three source identities visible and does not invent synthesis consensus or discard a P0 because synthesis is blocked."
  pass_threshold: 1.0
