id: review-authz-neighbor
title: "discover-testing: sourced repair regression"
input:
  prompt: |
    Use discover-testing.
    Analyze the sanitized static material only; do not perform external actions. Follow the main prompt with reasons, sources, evidence gaps, and minimal validation. Append `ID | DECISION | Evidence`, one row per ID, using the supplied enum values. PASS/FAIL is fixture comparison only, not real execution.
    Allowed DECISION values: authorization-testing.

    Route a request to check userA can read userB's record by changing objectID; login is already valid. The target is not installed. Name the canonical target and availability gap. Append a table row `ROUTE | <exact canonical ID> | availability evidence`. The DECISION cell here is the canonical target ID.
expect:
  exit_code: 0
judge:
  type: script
  script_path: evals/graders/review-authz-neighbor.py
  timeout_seconds: 30
